[project]
name = "fos-campaign-tracker"
version = "0.1.0"
description = "Internal campaign performance tracker for FOS sponsored campaigns"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "streamlit>=1.35",
    "pandas>=2.2",
    "pydantic>=2.7",
    "plotly>=5.20",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.16",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
