    youtube_paid_shorts:
      - "RBC_TST"
    # YT merge: RBC's GAds names ("RBC_TST_Social1_ChrisPaul", "RBC_TST_Cabana",
    # "RBC_TST_Panel Content1") and MS post titles ("When it comes to legacy
