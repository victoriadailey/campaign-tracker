# FOS Campaign Tracker — campaign config
# Edit and run: python -m app.viewer.refresh

exports_root: tests/fixtures

signals:
  - kind: opportunity
    title: "LinkedIn = free engagement"
    body: "TastyTrade, ADP, and E*TRADE all hit 4%+ ER on LinkedIn at $0 spend. Default-include in every content package."
  - kind: win
    title: "TikTok is your zero-cost reach engine"
    body: "TastyTrade TikTok delivered 592K views on $267 in spend — 228% of contracted impressions. Should be a default channel for every package."
  - kind: watch
    title: "E*TRADE pacing watch"
    body: "77% of flight elapsed but tracking behind on impressions. Cuban episode is now live — boost the cutdowns to close the gap."

sources:
  - { name: "Measure Studio",   date: "May 5, 2026",  stale: false }
  - { name: "Google Ads",       date: "May 5, 2026",  stale: false }
  - { name: "X Ads Manager",    date: "May 5, 2026",  stale: false }
  - { name: "Meta Business",    date: "May 4, 2026",  stale: false }
  - { name: "TikTok Ads",       date: "May 1, 2026",  stale: true  }
  - { name: "YouTube Studio",   date: "May 5, 2026",  stale: false }

campaigns:
  - id: adp
    partner: ADP
    series: Future of Sports
    series_italic: Sports
    type: content
    benchmark_category: "Original Content"
    lifecycle: wrapped     # was: active — wrapped 2026-06-18
    # ADP's GAds + X Ads campaigns are named by episode number, not guest.
    # When the auto-matcher can't pair by guest + paid_impr, fall back to
    # pairing MS↔ads rows by sorted-impression rank within each subtype.
    # Safe here because there's exactly one of each per episode.
    yt_paired_by_sort: true
    flight_start: 2025-10-01
    flight_end: 2026-05-31
    impression_goal: 6_600_000
    budget_goal: 10_916
    # Full Episodes (YT long-form + YT pre-roll + any post titled "Full Episode")
    # vs Cutdowns (everything else). Placeholder goals — update with the real
    # split once available. Sum should equal the campaign-level goals above.
    goal_split_full_ep:
      label: "Full Episodes"
      impression_goal: 3_400_000
      budget_goal: 5_500
    goal_split_cutdowns:
      label: "Cutdowns"
      impression_goal: 3_200_000
      budget_goal: 5_416
    color: ft-1
    lead_format: Longform Video
    blurb: "Three-episode interview series with HR & sports execs. Strong organic resonance on LinkedIn."
    sources:
      # MS API = base layer (organic + paid across IG/FB/TT/LI/X/YT).
      measure_studio_group_ids: [6217, 6111]   # Cutdowns + Full Episodes
      # GAds CSV supplements YT paid (MS under-counts YT in-feed paid impressions).
      youtube_paid:
        - adp_cutdown_yt_paid.csv
        - adp_full_episode_yt_paid.csv
      # X Ads CSV supplements X paid (MS doesn't track X paid at all).
      x_ads:
        - adp_cutdown_x_ads.csv
        - adp_full_episode_x_ads.csv
      # CSV fallback only kicks in if the API call fails:
      # measure_studio: [adp_cutdown_ms.csv, adp_full_episode_ms.csv]
    # yt_organic_impressions = hardcoded from YouTube Studio (MS/GAds don't
    # surface this reliably for YT long-form). Same pattern as PFP.
    episodes:
      - id: ep1
        n: "Ep. 01"
        title: "Kim Ng on Building Competence"
        date: "Mar 5"
        # ADP GAds + X Ads campaign names use "Episode 1 / Full Episode 1"
        # pattern instead of guest name. Include both so the attribution
        # picks up GAds in-feed/pre-roll + X Ads cutdowns.
        match: ["Kim Ng", "Full Episode 1", "Episode 1 Cutdown"]
        exclude: []
        yt_organic_impressions: 755
      - id: ep2
        n: "Ep. 02"
        title: "Inside the League of Legends Esports Ecosystem"
        date: "Mar 29"
        match: ["Greeley", "League of Legends", "Riot Games",
                "Full Episode 2", "Episode 2 Cutdown"]
        exclude: []
        yt_organic_impressions: 1069
      - id: ep3
        n: "Ep. 03"
        title: "Sarah Swanson on Women's Tennis at WTA"
        date: "Apr 27"
        match: ["Swanson", "WTA", "women's tennis",
                "Full Episode 3", "Episode 3 Cutdown"]
        exclude: []
        yt_organic_impressions: 7319
      - id: ep4
        n: "Ep. 04"
        title: "Inside Fastbreak AI's Schedule Engine"
        date: "May 18"
        match: ["Fastbreak", "Chris Groer", "John Stewart", "Groer", "Stewart",
                "Full Episode 4", "Episode 4 Cutdown"]
        exclude: []
        yt_organic_impressions: 5

  - id: etrade
    partner: E*TRADE
    series: Portfolio Players
    series_italic: Players
    type: content
    benchmark_category: "Original Content"
    lifecycle: active
    flight_start: 2026-01-01
    flight_end: 2026-12-31
    impression_goal: 41_700_000
    budget_goal: 70_000
    color: ft-3
    lead_format: Longform Video
    blurb: "Sports ownership & investing series. Mark Cuban (Ep. 9) just launched — Cuban + Donovan upcoming will round out the season."
    # E*TRADE forbids paid boosting on TikTok — all TT delivery is organic
    # by contract. Suppress the "TikTok resonating" OPPORTUNITY callout so
    # it doesn't read as an algorithmic signal when it's actually a
    # client mandate.
    organic_by_design_for: ["tiktok"]
    # MS provides the full performance numbers for every platform (organic +
    # paid combined). Paid sources (X Ads, Google Ads YT) supply only the
    # spend — refresh.py's merge step pairs each ads row with its matching
    # MS post by impressions_paid value, copies the spend over, drops the
    # ads row, and uses MS's descriptive title for display.
    #
    # Empty list means no platform is reduced to organic-only at parse time.
    # This works because the merge step prevents double-counting downstream.
    ms_organic_only_for: []
    # Manual X Ads ↔ MS pairings. When the auto-matcher can't pair a campaign
    # (impressions_paid drift too large, etc.) drop the X Ads campaign-name
    # substring + the MS tweet ID here. Substring is case-insensitive. These
    # pairings run BEFORE the exact/closest auto-match passes.
    # The needle (left side) is matched as a case-insensitive SUBSTRING against
    # the X Ads campaign name. Keys MUST be substrings of the actual campaign
    # names in the X Ads export — not the social team's preferred labeling.
    # e.g. social calls a video "Allyson Cutdown 2" but X Ads names it
    # "PFP_S3Ep6_AllysonFelix_Cutdown1" → needle must be `AllysonFelix_Cutdown1`.
    x_ads_pairings:
      "Checketts_Cutdown1":         "2052093377298997683"
      "Marshall_Cutdown 1":         "2047056447112986902"
      "Marshall_Cutdown 2":         "2049569125958066285"
      "Assia_Cutdown1":             "2036911003083170204"
      "Assia_Cutdown2":             "2039459036244942917"
      "Rabil_Cutdown1":             "2031837566417113541"
      "Osborne_SocialCutdown1":     "2026779162187329718"
      "Patricof Cutdown 2":         "2024265914258948319"
      "AllysonFelix_Cutdown1":      "2041622050297516271"
    sources:
      # MS API = base layer (organic + paid across IG/FB/TT/LI/X/YT).
      measure_studio_group_id: 6197         # Portfolio Players S3 x E*TRADE
      # GAds CSV supplements YT paid (MS under-counts YT in-feed).
      youtube_paid:
        - portfolio_players_yt_paid.csv
      # X Ads CSV supplements X paid (MS doesn't track X paid at all).
      x_ads:
        - portfolio_players_x_ads.csv
      # CSV fallback only if the API call fails:
      # measure_studio: [portfolio_players_ms.csv]
    # Most reliable attribution signal: MS column M ("User Tags") is tagged by
    # the social team with `PP Episode N - <Guest>`. Putting that string in the
    # match list wins on length/specificity vs any name-based keyword, so cross-
    # posts that use generic narratives still land on the right episode.
    episodes:
      # Generic Season 3 trailer / promo content — not tied to a specific guest.
      # Lives ahead of Ep. 01 in the list so it appears first on the campaign page.
      - id: trailer
        n: "Trailer"
        title: "Season 3 Trailer"
        date: "Jan 27"
        match: ["This is Portfolio Players"]
        exclude: []
        # Three trailer posts whose copy is generic ("Who are the athletes...",
        # "Who are the minds..."). They used to keyword-match into Ep. 01 Repole
        # via the description mentioning him as a guest — pin them here explicitly.
        manual_posts:
          - "LWtCVt9KnqY"                       # YT Shorts — "Who are the athletes…"
          - "3816686919355582288"               # IG — "Who are the minds…"
          - "urn:li:ugcPost:7420570894995005441" # LinkedIn — "This is Portfolio Players"
      # yt_organic_impressions = hardcoded from YouTube Studio. MS/GAds don't
      # reliably report organic impressions for YT long-form; the operator
      # supplies the number directly here and the dashboard never zeroes it.
      - id: ep1
        n: "Ep. 01"
        title: "Mike Repole on Sports Ownership"
        date: "Feb 3"
        match: ["PP Episode 1 -", "Repole", "Tom Brady", "Billionaire Built Brands", "Kobe"]
        exclude: []
        manual_posts:
          - "xW3fz52xFVg"   # YT Short "Women's Volleyball is THE Next Big Sports Investment #lovb"
                            #   — clip from Repole episode discussing LOVB / women's volleyball
                            #   investment. MS reports views=1,145 (used as impressions via the
                            #   YT-Shorts views-as-impressions floor).
        yt_organic_impressions: 2147
      - id: ep2
        n: "Ep. 02"
        title: "Jon Patricof on Athletes Unlimited"
        date: "Feb 12"
        # Cutdowns reference Patricof's businesses via @ handles + tags rather than his name
        match: ["PP Episode 2 -", "Patricof", "Athletes Unlimited", "@AUProSports", "@theAUSLofficial", "AUSL", "Pro Softball"]
        exclude: []
        manual_posts:
          - "2024266065409098028"   # 2/18 threaded tweet linking to full Patricof episode
        yt_organic_impressions: 593
      - id: ep3
        n: "Ep. 03"
        title: "Leslie Osborne on Women's Soccer"
        date: "Feb 27"
        match: ["PP Episode 3 -", "Osborne", "@LeslieOsborne12", "@leslieosborne12", "Bay FC", "@wearebayfc", "Female Messi"]
        exclude: []
        manual_posts:
          - "2026779233784136168"   # 2/25 threaded tweet linking to full Osborne episode
        yt_organic_impressions: 587
      - id: ep4
        n: "Ep. 04"
        title: "Paul Rabil on PLL Ownership"
        date: "Mar 31"
        match: ["PP Episode 4 -", "Rabil", "Premier Lacrosse", "PLL", "Capital Is Flooding"]
        exclude: []
        yt_organic_impressions: 1446
      - id: ep5
        n: "Ep. 05"
        title: "Assia Grazioli-Venier on Women's Sports Investment"
        date: "Apr 11"
        match: [
          "PP Episode 5 -",
          "Grazioli", "Muse Capital", "Muse Sport", "Assia", "@assiagrazioli",
          "AI officiating", "investment bubble", "Michele Kang", "Washington Spirit",
        ]
        exclude: []
        # Belt-and-suspenders for the 2 high-spend IG paid cross-posts.
        manual_posts:
          - "3865980741240680183"   # IG "If you use that narrative... no woman that's ever..." ($698.80)
          - "3860862608219404966"   # IG "interest in soccer in this country" ($798.52)
        yt_organic_impressions: 1306
      - id: ep6
        n: "Ep. 06"
        title: "Allyson Felix on Women's Sports Investment"
        date: "Apr 15"
        match: ["PP Episode 6 -", "Allyson Felix", "Allyson"]
        exclude: []
        manual_posts:
          - "3870854760043974001"   # 4/8 IG Story (Allyson Felix — no title/desc/cats)
          - "dSVJU1eYBmI"           # YT longform "From Olympic Gold to Founder:
                                    # Allyson Felix's Next Chapter" — description
                                    # has chapter timestamps mentioning Assia/Michele
                                    # Kang/Washington Spirit (topics Allyson discusses)
                                    # which scored higher than Ep 6's keywords. The
                                    # User Tags column unambiguously says
                                    # "PP Episode 6 - Allyson Felix" — pin it here.
        yt_organic_impressions: 1885
      - id: ep7
        n: "Ep. 07"
        title: "Brandon Marshall on the Athlete Media Empire"
        date: "Apr 21"
        match: ["PP Episode 7 -", "Brandon Marshall", "Marshall", "TV networks", "Athlete Media", "active player to do TV"]
        exclude: []
        yt_organic_impressions: 6361
      - id: ep8
        n: "Ep. 08"
        title: "Dave Checketts on Sports Investing"
        date: "May 5"
        match: ["PP Episode 8 -", "Checketts", "Former Knicks", "Legendary NBA Exec", "Michael Jordan", "David Stern"]
        exclude: []
        yt_organic_impressions: 10962
      - id: ep9
        n: "Ep. 09"
        title: "Mark Cuban Explains The Business of Owning an NBA Team"
        date: "May 20"
        match: ["PP Episode 9 -", "Mark Cuban", "Cuban"]
        # Excludes still protect against cross-episode posts mentioning Cuban
        # — those land in their original episode (e.g. Repole talking about
        # how he's given more NIL money "than Mark Cuban gives to Indiana").
        exclude: ["Repole", "Marshall", "Checketts", "Allyson", "PP Episode 1", "PP Episode 7", "PP Episode 8", "PP Episode 6"]
        # Posts pinned to Cuban by native ID. The keyword matcher misses
        # them because:
        #   • Snapchat: empty title/description on MS — only `user_tags`
        #     identifies the episode, which the matcher doesn't read.
        #   • IG Stories: stories have no caption text, so nothing for the
        #     matcher to grip onto. Three stories from the Cuban launch week
        #     (5/19 – 5/21) — views (4288, 2413, 3783) count as impressions
        #     via the IG views-as-impressions fallback.
        #   • X teaser: "Full episode of Portfolio Players ... coming next
        #     week" posted 5/12, teasing Cuban's 5/20 launch. 4,456 impr.
        manual_posts:
          - "W7_EDlXWTBiXAEEniNoMPwAAYdmlubXZ1c3JsAZ5LizLqAZ5Liw_ZAAAAAw"  # SC Spotlight 5/21 — 7,176 impr
          - "a0cf513e-a9f7-5958-8ba1-d2dbc38a097f"                          # SC Highlight 5/06
          - "W7_EDlXWTBiXAEEniNoMPwAAYZXZ0emVwbnd4AZ37FoP4AZ37Fk-lAAAAAw"  # SC Spotlight 5/05 — 4,303 impr
          - "3902135684652405748"   # IG Story 5/21 — 4,288 views (no caption)
          - "3901528950736512749"   # IG Story 5/20 — 2,413 views (no caption)
          - "3900714239756695378"   # IG Story 5/19 — 3,783 views (no caption)
          - "2054307306662138269"   # X teaser 5/12 — 4,456 impr ("Full episode coming next week")
        yt_organic_impressions: 5768
      - id: ep10
        n: "Ep. 10"
        title: "Landon Donovan on Soccer in America"
        date: "Jun 5"
        match: ["PP Episode 10 -", "Landon Donovan", "@landondonovan", "landon donovan"]
        exclude: []
      # Upcoming episodes — placeholders so the schedule shows on the campaign card.
      # No keyword matching yet; posts will be added once they go live.
      - id: ep11
        n: "Ep. 11"
        title: "Midge Purce"
        date: "Jun 16"
        match: ["PP Episode 11 -", "Midge Purce", "@midgepurce"]
        exclude: []
        # LinkedIn cutdowns whose copy quotes Midge ("I was envious…", "To give
        # publications like ESPN…") without naming her, so the keyword matcher
        # misses them (the X/IG/TikTok versions match fine). Pin by native ID.
        manual_posts:
          - "urn:li:ugcPost:7472761999580463104"   # LI "I was envious… in my sport…"
          - "urn:li:ugcPost:7473079538042826752"   # LI "To give publications like ESPN…"
          - "urn:li:ugcPost:7475258225211158528"   # LI cutdown (quotes Midge, unnamed)
      - id: ep12
        n: "Ep. 12"
        title: "Josh Childress"
        date: "Jun 30"
        match: ["PP Episode 12 -", "Josh Childress", "@joshchildress"]
        exclude: []
      - id: ep13
        n: "Ep. 13"
        title: "Arturo Lomeli"
        date: "Jul 14"
        # MS titles the hero + cutdowns by his company, not his name ("How the
        # Clase Azul Tequila Founder…"), and spells the name accented ("Lomelí")
        # — accent-folding handles the latter; "Clase Azul"/"tequila founder"
        # catch the descriptive titles.
        match: ["PP Episode 13 -", "Arturo Lomeli", "@arturolomeli", "Clase Azul", "tequila founder"]
        exclude: []
      - id: ep14
        n: "Ep. 14"
        title: "Marques Colston"
        date: "Jul 28"
        # "Colston" (single token) also catches the Saints/NIL descriptive titles.
        match: ["PP Episode 14 -", "Marques Colston", "Colston", "@marquescolston"]
        exclude: []
      - id: ep15
        n: "Ep. 15"
        title: "Kerri Walsh Jennings"
        date: "Aug 2026"
        # Some cutdowns are quote-titled without her name ("…sleeping on
        # couches…", "…only relevant one of those 4 years"), so match those
        # fragments too. "beach volleyball" is unique to her in this series.
        # "kerrileewalsh" catches posts that only tag her handle (@kerrileewalsh)
        # without spelling out "Kerri Walsh".
        match: ["PP Episode 15 -", "Kerri Walsh", "kerrileewalsh", "beach volleyball",
                "sleeping on couches", "only relevant one of those"]
        exclude: []

  - id: spectrum
    partner: Spectrum
    series: Fueling Dreams
    series_italic: Dreams
    type: social    # social-only — no episode breakdown, posts shown directly
    benchmark_category: "Custom Social"
    lifecycle: wrapped     # wrapped 2026-09-10
    # YouTube on this campaign runs paid via Google Ads. Reduce MS YT to its
    # organic share so MS + Google Ads don't double-count the boosted impressions.
    ms_organic_only_for:
      - youtube
    # YT Shorts pairing: Spectrum's GAds campaigns ("NASCAR DITL", "NASCAR -
    # Small Biz") boost the same FOS YT Shorts that MS tracks organically.
    # MS post titles ("From the garage...", "From the hangar...") share no
    # word tokens with the GAds names, so guest-matching can't pair them.
    # Opt into sorted-position pairing (Pass 5) — within the Shorts subtype,
    # MS + GAds are sorted by impressions_paid desc and zipped 1:1. Both sides
    # only have 2 posts each, both close-matched on paid_impr, so the sort
    # pairs DITL↔DITL and Small Biz↔Small Biz cleanly.
    yt_paired_by_sort: true
    flight_start: 2026-05-01
    flight_end: 2026-06-30
    # Two-part campaign: NASCAR (5.75M / $17,525) + World Cup (4.5M / $12,125).
    # Campaign-level totals = sum across both parts.
    impression_goal: 10_250_000
    budget_goal: 29_650
    # Pacing-by-component view (rendered as its own section on the campaign
    # page). Each bucket aggregates one or more of the 5 episode components and
    # tracks delivery against its own impression goal. NASCAR + World Cup share
    # a single goal within Highlights and within Cutdowns.
    # NASCAR + World Cup each carry their own goal within Highlights (4M each →
    # 8M) and Cutdowns (500K each → 1M). DITL is NASCAR-only (1.25M). The three
    # buckets sum to the 10.25M campaign headline goal.
    # NASCAR and World Cup are tracked separately — each Highlights flight must
    # hit its own 4M and each Cutdowns flight its own 500K (DITL is NASCAR-only,
    # 1.25M). Five buckets summing to the 10.25M campaign headline goal.
    pacing_components:
      - label: "Day in the Life"
        impression_goal: 1_250_000
        episode_ids: [nascar_ditl]
      - label: "Small Business Highlights — NASCAR"
        impression_goal: 4_000_000
        episode_ids: [nascar_smb_highlight]
      - label: "Small Business Highlights — World Cup"
        impression_goal: 4_000_000
        episode_ids: [wc_smb_highlight]
      - label: "Small Business Cutdowns — NASCAR"
        impression_goal: 500_000
        episode_ids: [nascar_smb_cutdowns]
      - label: "Small Business Cutdowns — World Cup"
        impression_goal: 500_000
        episode_ids: [wc_smb_cutdowns]
    color: ft-2
    lead_format: Made for Social
    blurb: "Two-part Fueling Dreams series with Spectrum Business. NASCAR (Texas Motor Speedway) live; World Cup launch pending."
    # Two Vintage Flying Museum FB Reels render as "organic+boosted" against
    # token noise (org=2 and org=5 against ~300K paid impressions each).
    # Force them to paid-only so the table reads cleanly. These platform_ids
    # come from MS — see the FB Reels with the "Vintage Flying Museum"
    # description.
    paid_only_post_ids:
      - "1481331077339811"   # FB 5/29 — "Go behind the scenes with the Vintage Flying Museum… Spectrum Business powers…"
      - "1479528744186711"   # FB 5/27 — "From the hangar to race day, see how Spectrum Business helps keep the Vintage Flying Museum…"
    # Drop the stray X "Branded article Promo" campaign entirely — it was tied to
    # a (since-removed) component by mistake and isn't part of Spectrum's report.
    # Campaign-level exclude survives X Ads re-uploads (lives in config, applied
    # every refresh).
    exclude:
      - "Branded article"
    # Google Ads exports drop the "(shorts)" tag from campaign names, so mark
    # which Spectrum Google Ads campaigns are YT Shorts — their paid spend then
    # merges onto the right Shorts post instead of floating as in-feed.
    youtube_paid_shorts:
      - "NASCAR"
    sources:
      # Spectrum was restructured into three MS post groups (June '26):
      measure_studio_group_ids:
        - 7172                              # Spectrum x NASCAR - DITL
        - 7722                              # Spectrum x NASCAR - Small Business Highlight
        - 7723                              # Spectrum x NASCAR - Small business (dark) cutdowns
        - 7759                              # Spectrum x World Cup - Small Business Highlight
      meta_ads:
        # World Cup dark cutdown only. The NASCAR dark cutdowns are already in
        # MS group 7723 (spend matches to the cent) — including them here would
        # double-count, so they're deliberately excluded from this fixture.
        - spectrum_meta_ads.csv
      youtube_paid:                         # supplements MS's YT in-feed gap
        - spectrum_yt_paid.csv
      x_ads:                                # paid X (Spectrum: NASCAR - Small Biz)
        - spectrum_x_ads.csv
      # CSV fallback only if the API call fails:
      # measure_studio: [spectrum_ms.csv]
    episodes:
      # Five components mirroring the MS post-group restructure (June '26).
      # NASCAR components attribute by group (definitive); keywords are the
      # fallback for any unmerged ad rows. World Cup components are defined
      # ahead of launch — they render once posts exist.
      - id: nascar_ditl
        n: "Part 01"
        title: "NASCAR — Day in the Life"
        date: "May 2026"
        group_ids: [7172]               # Spectrum x NASCAR - DITL
        match: ["DITL", "garage", "pit road"]
        exclude: ["World Cup"]           # keep World Cup ad rows out of NASCAR
        impression_goal: 1_250_000
        budget_goal: 5_400
      - id: nascar_smb_highlight
        n: "Part 02"
        title: "NASCAR — Small Business Highlight"
        date: "May 2026"
        group_ids: [7722]               # Spectrum x NASCAR - Small Business Highlight
        match: ["Small Biz", "hangar to the race track"]
        # "Small Biz" also appears in the World Cup rows ("World Cup" with a
        # space, "WorldCup" without — the Meta cutdown uses the latter).
        exclude: ["World Cup", "WorldCup"]
        impression_goal: 4_000_000
        budget_goal: 10_125
      - id: nascar_smb_cutdowns
        n: "Part 03"
        title: "NASCAR — Small Business Cutdowns"
        date: "May 2026"
        group_ids: [7723]               # Spectrum x NASCAR - Small business (dark) cutdowns
        match: ["Vintage Flying Museum", "hangar to race day"]
        exclude: ["World Cup"]
        impression_goal: 500_000
        budget_goal: 2_000
      - id: wc_smb_highlight
        n: "Part 04"
        title: "World Cup — Small Business Highlight"
        date: "Jun 2026"
        group_ids: [7759]               # Spectrum x World Cup - Small Business Highlight
        match: ["World Cup"]            # fallback for groupless ad rows
        exclude: []
        impression_goal: 4_000_000
        budget_goal: 10_125
      - id: wc_smb_cutdowns
        n: "Part 05"
        title: "World Cup — Small Business Cutdowns"
        date: "Jun 2026"
        # Meta dark cutdown campaign name: "Spectrum_WorldCup_Small Biz Cutdown1".
        # No MS group yet — attributes by name. Add group_ids when one exists.
        match: ["WorldCup_Small Biz Cutdown", "World Cup Cutdown"]
        exclude: []
        impression_goal: 500_000
        budget_goal: 2_000

  # ============== BrandX campaigns (paid-social performance) ==============
  # BrandX = paid-only, dark social campaigns optimized for clicks +
  # efficiency rather than engagement / organic reach. Different page
  # treatment in the dashboard: top KPIs are impressions / ad spend / clicks
  # and the per-post table foregrounds CTR / CPC / CPM.

  - id: etrade_brandx
    partner: E*TRADE
