# FOS Campaign Tracker — campaign config
# Edit and run: python -m app.viewer.refresh

exports_root: tests/fixtures

signals:
  - kind: opportunity
    title: "LinkedIn = free engagement"
    body: "TastyTrade, ADP, and E*TRADE all hit 4%+ ER on LinkedIn at $0 spend. Default-include in every content package."
  - kind: win
    title: "TikTok is your zero-cost reach engine"
    body: "TastyTrade TikTok delivered 592K views on $267 in spend — 228% of contracted impressions. Should be a default channel for every package."
  - kind: watch
    title: "E*TRADE pacing watch"
    body: "72% of flight elapsed but only 11% of impressions delivered. Mark Cuban episode launching this week should close the gap."

sources:
  - { name: "Measure Studio",   date: "May 5, 2026",  stale: false }
  - { name: "Google Ads",       date: "May 5, 2026",  stale: false }
  - { name: "X Ads Manager",    date: "May 5, 2026",  stale: false }
  - { name: "Meta Business",    date: "May 4, 2026",  stale: false }
  - { name: "TikTok Ads",       date: "May 1, 2026",  stale: true  }
  - { name: "YouTube Studio",   date: "May 5, 2026",  stale: false }

campaigns:
  - id: adp
    partner: ADP
    series: Future of Sports
    series_italic: Sports
    type: content
    flight_start: 2025-10-01
    flight_end: 2026-05-31
    impression_goal: 6_600_000
    budget_goal: 10_916
    color: ft-1
    lead_format: Longform Video
    blurb: "Three-episode interview series with HR & sports execs. Strong organic resonance on LinkedIn."
    ms_post_groups:
      - "Future of Sports"
      - "Future of Sports: Full Ep"
      - "Future of Sports: Cutdowns"
    sources:
      measure_studio:
        - adp_cutdown_ms.csv
        - adp_full_episode_ms.csv
      google_ads_campaign:
        - adp_cutdown_gads_campaign.csv
        - adp_full_episode_gads_campaign.csv
      x_ads:
        - adp_cutdown_x_ads.csv
        - adp_full_episode_x_ads.csv
    episodes:
      - id: ep1
        n: "Ep. 01"
        title: "Kim Ng on Building Competence"
        date: "Mar 5"
        match: ["Kim Ng"]
        exclude: []
      - id: ep2
        n: "Ep. 02"
        title: "Inside the League of Legends Esports Ecosystem"
        date: "Mar 29"
        match: ["Greeley", "League of Legends", "Riot Games"]
        exclude: []
      - id: ep3
        n: "Ep. 03"
        title: "Sarah Swanson on Women's Tennis at WTA"
        date: "Apr 27"
        match: ["Swanson", "WTA", "women's tennis"]
        exclude: []

  - id: etrade
    partner: E*TRADE
    series: Portfolio Players
    series_italic: Players
    type: content
    flight_start: 2026-01-01
    flight_end: 2026-06-30
    impression_goal: 45_000_000
    budget_goal: 50_000
    color: ft-3
    lead_format: Longform Video
    blurb: "Sports ownership & investing series. Mark Cuban teaser is generating organic buzz ahead of launch."
    ms_post_groups:
      - "Portfolio Players S3"
      - "Portfolio Players S3 x E*TRADE"
    # MS is the authoritative YT paid source — it has all 8 episodes (Google Ads YT
    # export was missing Ep 8 Checketts). For X, the X Ads file is authoritative.
    ms_organic_only_for:
      - x
    sources:
      measure_studio:
        - portfolio_players_ms.csv
      x_ads:
        - portfolio_players_x_ads.csv
    episodes:
      - id: ep1
        n: "Ep. 01"
        title: "Mike Repole on Sports Ownership"
        date: "Feb 3"
        match: ["Repole"]
        exclude: []
      - id: ep2
        n: "Ep. 02"
        title: "Jon Patricof on Athletes Unlimited"
        date: "Feb 12"
        match: ["Patricof", "Athletes Unlimited"]
        exclude: []
      - id: ep3
        n: "Ep. 03"
        title: "Leslie Osborne on Women's Soccer"
        date: "Feb 27"
        match: ["Osborne"]
        exclude: []
      - id: ep4
        n: "Ep. 04"
        title: "Paul Rabil on PLL Ownership"
        date: "Mar 31"
        match: ["Rabil", "Premier Lacrosse"]
        exclude: []
      - id: ep5
        n: "Ep. 05"
        title: "Assia Grazioli-Venier on Women's Sports Investment"
        date: "Apr 11"
        match: ["Grazioli", "Muse Capital", "Assia"]
        exclude: []
      - id: ep6
        n: "Ep. 06"
        title: "Allyson Felix on Women's Sports Investment"
        date: "Apr 15"
        match: ["Allyson Felix", "Allyson"]
        exclude: []
      - id: ep7
        n: "Ep. 07"
        title: "Brandon Marshall on the Athlete Media Empire"
        date: "Apr 21"
        match: ["Brandon Marshall", "Marshall"]
        exclude: []
      - id: ep8
        n: "Ep. 08"
        title: "Dave Checketts on Sports Investing"
        date: "May 5"
        match: ["Checketts", "Former Knicks"]
        exclude: []
      # Mark Cuban episode hasn't aired yet — only teasers are live. Real interview
      # posts will land here once published. Excludes protect against other-episode
      # posts that mention Cuban being attributed to the wrong episode.
      - id: ep9
        n: "Ep. 09"
        title: "Mark Cuban (teasers only — episode pending)"
        date: "Coming soon"
        match: ["Mark Cuban", "Cuban"]
        exclude: ["Repole", "Marshall", "Checketts", "Allyson"]

  - id: spectrum
    partner: Spectrum
    series: Fueling Dreams
    series_italic: Dreams
    type: social    # social-only — no episode breakdown, posts shown directly
    flight_start: 2026-05-01
    flight_end: 2026-06-30
    # Two-part campaign: NASCAR (5.75M / $17,525) + World Cup (4.5M / $12,125).
    # Campaign-level totals = sum across both parts.
    impression_goal: 10_250_000
    budget_goal: 29_650
    color: ft-2
    lead_format: Made for Social
    blurb: "Two-part Fueling Dreams series with Spectrum Business. NASCAR (Texas Motor Speedway) live; World Cup launch pending."
    ms_post_groups:
      - "Spectrum"
    sources:
      measure_studio:
        - spectrum_ms.csv
    episodes:
      - id: nascar
        n: "Part 01"
        title: "NASCAR — Texas Motor Speedway"
        date: "May 2026"
        match: ["NASCAR", "Texas Motor", "Speedway", "pit road", "garage"]
        exclude: []
        impression_goal: 5_750_000
        budget_goal: 17_525
      - id: worldcup
        n: "Part 02"
        title: "World Cup"
        date: "Pending"
        match: ["World Cup"]
        exclude: []
        impression_goal: 4_500_000
        budget_goal: 12_125

  - id: mm
    partner: Morgan & Morgan
    series: The Case Study
    series_italic: Case Study
    type: social    # post-based tracking; no episode rollup
    flight_start: 2026-05-01
    flight_end: 2026-05-31
    impression_goal: 1_500_000
    budget_goal: 5_000
    color: ft-5
    lead_format: Made for Social
    blurb: "Case Study series with Morgan & Morgan on NIL & college sports business. 2 videos live + 1 more coming + 2 static posts in progress."
    ms_post_groups:
      - "Morgan & Morgan"
    sources:
      measure_studio:
        - morgan_morgan_ms.csv

  - id: usbank
    partner: US Bank
    series: NFL Draft
    series_italic: Draft
    type: social
    flight_start: 2026-04-21
    flight_end: 2026-04-27
    impression_goal: 14_000_000
    budget_goal: 31_375
    color: ft-4
    lead_format: Made for Social
    blurb: "3 social components, 38 posts live across IG, FB, X, LinkedIn & YouTube Shorts. Delivered 103.6% of impression goal on 98.8% of budget."
    ms_post_groups:
      - "NFL Draft"
    sources:
      measure_studio: []
