  - id: heineken
    partner: Heineken
    series: "World Cup"
    series_italic: "World Cup"
    # Heineken is a 2-component social-style campaign (Editorial Video for
    # FOSN + Red Card / Green Flag for FOS Main), not an episodic series.
    # Categorized under Social so it lives in the sidebar's Social group;
    # the two `episodes:` entries below render as side-by-side "component
    # comparison" cards via the social-type rendering path in campaign.jsx
    # rather than as a vertical per-episode performance table.
    type: social
    benchmark_category: "Original Content"
    lifecycle: wrapped     # wrapped 2026-09-10
    flight_start: 2026-05-18
    flight_end: 2026-07-31
    # Sum of both editorial pieces — primary goals live on each episode entry below.
    impression_goal: 3_500_000
    budget_goal: 13_900
    color: ft-4
    lead_format: Longform Video
    blurb: "Two editorial pieces for Heineken x World Cup: an FOS NEWS editorial video (UEFA) and Red Card / Green Flag (FOS Main)."
    # The 2 GAds Shorts ("Heineken: UEFA…", "Heineken (FOSN): USA-Paraguay") and
    # the 2 MS YT Shorts share exact impressions but no title token, so the
    # guest-match passes can't pair them. Opt into sorted-position pairing so the
    # GAds paid spend merges onto the MS posts instead of counting as separate
    # YT posts (which double-counted YouTube in the campaign rollup).
    yt_paired_by_sort: true
    # Track the two pieces against their own impression goals (like Spectrum).
    # Red Card / Green Flag is now live (MS group 8042).
    pacing_components:
      - label: "FOSN x Heineken"
        impression_goal: 2_000_000
        episode_ids: [editorial_fosn]
      - label: "Red Card / Green Flag"
        impression_goal: 1_500_000
        episode_ids: [red_card_green_flag]
    episodes:
      - id: editorial_fosn
        n: "Video 1"
        title: "Editorial Video — FOS NEWS"
        date: "May 2026"
        group_ids: [7587]             # MS post group — definitive component split
        # GAds names this "Heineken: UEFA (FOSN)". FOSN = FOS NEWS.
        # Native social cutdowns use "Champions League" in copy (the
        # UEFA tournament being discussed) — add as a match keyword so
        # cross-platform IG/FB posts also land on this episode.
        match: ["FOSN", "FOS NEWS", "UEFA", "Editorial", "Champions League", "Heineken"]
        exclude: []
        # Posts pinned by native ID because the keyword matcher can't reach
        # them (empty/template descriptions, mostly Stories).
        # The old Y1A4YYmNyc0 cross-group pin (FOS main YT) is removed —
        # MS now exposes a dedicated "Front Office Sports News" YT account
        # whose Heineken Short ("Baker Machado breaks down the growth of
        # European soccer…") sits in group 7587 natively and absorbs the
        # GAds spend via the standard YT merge. The cross-group post was a
        # duplicate of the same Champions League creative.
        manual_posts:
          - "3908614570004578420"   # IG Story 5/30 — 66 views, no caption
          - "978645078355801"       # FB Story 5/30 — no caption, FB cross-post of the IG story
        impression_goal: 2_000_000
        budget_goal: 7_500
      - id: red_card_green_flag
        n: "Video 2"
        title: "Red Card / Green Flag — FOS Main"
        date: "Jul 2026"
        group_ids: [8042]             # MS group holds the RCGF YT short (dark)
        match: ["RedCardGreenFlag", "Red Card", "Green Flag"]  # Meta/GAds ad rows
        exclude: []
        impression_goal: 1_500_000
        budget_goal: 6_400
    # Red Card / Green Flag is fully DARK (paid), across BOTH of its videos.
    # Sourcing per video:
    #   Video 1 — YT from Google Ads (352K), FB+IG from the Meta export. MS 8042
    #             over-reports FB on this dark ad, so drop MS 8042's Video-1 FB+IG
    #             posts by native id and use the Meta export instead.
    #   Video 2 — YT from Google Ads (194K), FB+IG from Measure (group 8042). The
    #             team removed Video 2 from the Meta export to avoid double-count,
    #             so its FB/IG comes from MS — keep those posts.
    # The MS YT shorts (-aFklAAQ9Js = V1, cumisrPzJ-U = V2) are kept as pairing
    # anchors so each GAds RCGF row merges onto its own short (not a FOSN short).
    exclude:
      - "1512716967534555"    # MS 8042 RCGF Video-1 Facebook (use Meta export instead)
      - "3932495664965122403" # MS 8042 RCGF Video-1 Instagram (use Meta export instead)
    # The GAds "Heineken_RedCardGreenFlag_Video1" row has no "(shorts)" tag, so it
    # was classified in-feed and showed as a SECOND YT post duplicating the MS
    # short -aFklAAQ9Js. Force it to Shorts so it merges onto that short instead.
    youtube_paid_shorts:
      - "RedCardGreenFlag_Video1"
    # RCGF is dark — show its MS posts as paid-only (no organic+boosted split).
    paid_only_post_ids:
      - "-aFklAAQ9Js"           # V1 YouTube short (anchor for GAds V1)
      - "cumisrPzJ-U"           # V2 YouTube short (anchor for GAds V2)
      - "1518368396969412"      # V2 Facebook (dark, from Measure)
      - "3936824922667590577"   # V2 Instagram (dark, from Measure)
    sources:
      measure_studio_group_ids:
        - 7587                              # Heineken x FOSN (editorial, organic)
        - 8042                              # Red Card / Green Flag (both videos, dark)
      youtube_paid:
        - heineken_yt_paid.csv              # FOSN shorts + RCGF V1/V2 shorts (dark)
      meta_ads:
        - heineken_meta_ads.csv             # RCGF Video 1 dark ads (FB + IG)

