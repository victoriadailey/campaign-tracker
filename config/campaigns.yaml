  - id: threem
    partner: 3M
    series: "3M Open"
    series_italic: Open
    # Three-component campaign (like BetMGM): FOS Engineered video + cutdowns,
    # a dark DITL video, and 2 static posts — each tracked to its own goal via
    # pacing_components below.
    type: social
    benchmark_category: Branded Content
    lifecycle: wrapped     # wrapped 2026-09-10
    # Google Ads names the YT buys by format ("(in-feed)", "(pre-roll)",
    # "(shorts)") not a title token MS shares, so pair GAds↔MS by sorted
    # impressions within each YT subtype — folds the paid spend + impressions
    # onto the matching MS post instead of double-counting the hero in-feed.
    yt_paired_by_sort: true
    # Flight is a best estimate (planner shows Engineered 7/21–7/27; boosts
    # ending ~now). Adjust if the DITL/static flights differ.
    flight_start: 2026-07-21
    flight_end: 2026-07-31
    # Sum of the three components below.
    impression_goal: 7_150_000
    budget_goal: 17_522
    color: ft-7
    lead_format: Social Video
    blurb: "3M x FOS golf-engineering content for the 3M Open — a FOS Engineered hero video plus cutdowns, a dark Day-in-the-Life video, and two static posts."
    # Drop the Measure version of the "A driver has to survive…" dark FB static —
    # MS under-reports it (~126K). The true 502,526 is restated in sources.manual_rows.
    exclude:
      - "1530555005750751"
    pacing_components:
      - label: "FOS Engineered + Cutdowns"
        impression_goal: 3_750_000
        episode_ids: [engineered]
      - label: "DITL (Dark Video)"
        impression_goal: 1_800_000
        episode_ids: [ditl]
      - label: "2 Static Posts"
        impression_goal: 1_600_000
        episode_ids: [static]
    episodes:
      - id: engineered
        n: "Part 01"
        title: "FOS Engineered + Cutdowns"
        date: "Jul 2026"
        # Hero "How 3M Science Helps Make Golf's Best Clubs" + golf-club cutdowns.
        match: ["Engineered", "3M Science", "golf club", "Best Clubs", "build a golf", "starts long before"]
        exclude: []
        impression_goal: 3_750_000
        budget_goal: 5_622
      - id: ditl
        n: "Part 02"
        title: "DITL — Day in the Life"
        date: "Jul 2026"
        match: ["Day in the Life", "DITL", "3M Open than just"]
        exclude: []
        # Dark TikTok cut of the DITL video — no title/caption for the matcher
        # to catch, so pin it by native id.
        manual_posts:
          - "1871624422467585"
        impression_goal: 1_800_000
        budget_goal: 6_300
      - id: static
        n: "Part 03"
        title: "2 Static Posts"
        date: "Jul 2026"
        # Static 1: "A driver has to survive forces…"  Static 2: "The 3M Open is
        # one of the few sporting events where the title sponsor's own
        # technologies help bring the tournament to life."
        match: ["driver has to survive", "forces most material",
                "one of the few sporting events", "bring the tournament to life",
                "Thousands of fans move through", "Static"]
        exclude: []
        impression_goal: 1_600_000
        budget_goal: 5_600
    sources:
      # NOTE: the full Meta export is intentionally NOT wired — Measure already
      # tracks these posts, so wiring it double-counted every static. Measure is
      # correct for everything EXCEPT one dark FB static ("A driver has to
      # survive…") which MS under-reports (~126K vs the true 502,526 from Meta).
      # We drop the MS version (excluded by native id above) and restate the
      # real figure via manual_rows below.
      manual_rows:
        - title: "A driver has to survive forces most materials (FB) — dark"
          platform: facebook
          impressions: 502526
          spend: 1400
          clicks: 3
      youtube_paid:
        - threem_yt_paid.csv
      # Measure Studio group "3M" (8322) — organic + any boosted MS tracks.
      # NOTE: the paid boost delivery (millions of impressions on YT/Meta/TikTok)
      # lives in the Google Ads + Meta exports; upload those via the 3M card
      # (→ threem_yt_paid.csv, threem_meta_ads.csv) for full paid pacing.
      measure_studio_group_ids:
        - 8322

