<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pulse — US Bank x NFL Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   FOS SOCIAL DASHBOARD — DESIGN SYSTEM
   Editorial proprietary feel: Liquorice + Sunshine + Cream
   ============================================================ */

:root {
  /* Palette — Editorial (default) */
  --liquorice: #1F1A15;
  --liquorice-2: #15110d;
  --sunshine: #FFE019;
  --cream: #F5F1E8;
  --cream-2: #ECE6D6;
  --paper: #FAF7EF;
  --blossom: #F2A6A8;
  --flame: #DE6B38;
  --orange: #FF9947;
  --pear: #8FC766;
  --sky: #5CB5F2;
  --lilac: #A896F2;

  /* Semantic */
  --bg: var(--cream);
  --bg-soft: var(--cream-2);
  --surface: var(--paper);
  --ink: var(--liquorice);
  --ink-2: #443c33;
  --ink-3: #857d70;
  --line: rgba(31, 26, 21, 0.10);
  --line-2: rgba(31, 26, 21, 0.18);
  --accent: var(--flame);
  --accent-ink: var(--paper);
  --positive: #2f7a3f;
  --warning: var(--orange);
  --danger: #b8392b;

  /* Type */
  --serif: 'Newsreader', 'Source Serif 4', 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;

  /* Spacing scale */
  --pad-xs: 8px;
  --pad-sm: 12px;
  --pad-md: 16px;
  --pad-lg: 24px;
  --pad-xl: 32px;

  /* Radius */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;

  /* Shadows */
  --sh-1: 0 1px 0 rgba(36,28,23,0.06), 0 1px 2px rgba(36,28,23,0.04);
  --sh-2: 0 4px 20px -8px rgba(36,28,23,0.18);

  /* Density */
  --row-h: 44px;
  --card-pad: 22px;
}

[data-density="compact"] {
  --pad-md: 12px;
  --pad-lg: 18px;
  --pad-xl: 24px;
  --row-h: 36px;
  --card-pad: 16px;
}

[data-density="spacious"] {
  --pad-md: 20px;
  --pad-lg: 32px;
  --pad-xl: 44px;
  --row-h: 52px;
  --card-pad: 28px;
}

/* DARK */
[data-theme="dark"] {
  --bg: #18130f;
  --bg-soft: #201914;
  --surface: #2a221c;
  --ink: #f7eecf;
  --ink-2: #cbbfa5;
  --ink-3: #8a7e6a;
  --line: rgba(247, 238, 207, 0.10);
  --line-2: rgba(247, 238, 207, 0.18);
}

/* PALETTE: Sky */
[data-palette="sky"] {
  --accent: var(--sky);
  --accent-ink: #082c46;
}
/* PALETTE: Sunshine */
[data-palette="sunshine"] {
  --accent: var(--sunshine);
  --accent-ink: var(--liquorice);
}
/* PALETTE: Flame */
[data-palette="flame"] {
  --accent: var(--flame);
  --accent-ink: #fff7ee;
}
/* PALETTE: Pear */
[data-palette="pear"] {
  --accent: var(--pear);
  --accent-ink: #1d3a10;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

a { color: inherit; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: var(--liquorice);
  color: var(--cream);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sb-brand {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 8px 22px;
  border-bottom: 1px solid rgba(252,247,219,0.12);
  margin-bottom: 18px;
}
.sb-brand .mark {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--cream); color: var(--liquorice);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 22px; font-weight: 300; line-height: 1;
  flex-shrink: 0; align-self: center;
}
.sb-brand .name {
  font-family: var(--serif); font-size: 22px; line-height: 1;
  font-weight: 300; letter-spacing: -0.01em;
}
.sb-brand .name em { font-style: italic; color: var(--cream); }

.sb-section {
  text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.12em;
  color: rgba(252,247,219,0.4);
  padding: 14px 10px 6px;
  font-weight: 600;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: rgba(252,247,219,0.78);
  cursor: pointer; transition: all .15s;
  border: none; background: none;
  width: 100%; text-align: left;
  font-family: inherit;
}
.sb-item:hover { background: rgba(252,247,219,0.06); color: var(--cream); }
.sb-item.active {
  background: var(--cream); color: var(--liquorice);
  font-weight: 600;
}
.sb-item .ic { width: 16px; height: 16px; flex-shrink: 0; }
.sb-item .dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-left: auto;
}
.sb-foot {
  margin-top: auto;
  padding: 14px 10px;
  border-top: 1px solid rgba(252,247,219,0.12);
  display: flex; align-items: center; gap: 10px;
}
.sb-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blossom); color: var(--liquorice);
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
}
.sb-foot .who { font-size: 12px; line-height: 1.3; }
.sb-foot .who .nm { color: var(--cream); font-weight: 600; }
.sb-foot .who .em { color: rgba(252,247,219,0.5); }

/* MAIN */
.main {
  padding: 28px 36px 60px;
  min-width: 0;
}

/* HEADER */
.head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}
.head-title {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--ink);
}
.head-title em { font-style: italic; }
.head-sub { font-size: 13px; color: var(--ink-3); max-width: 520px; }
.head-sub strong { color: var(--ink); font-weight: 600; }
.head-actions { display: flex; gap: 10px; align-items: center; }

/* BUTTONS */
.btn {
  font-family: var(--sans);
  font-size: 13px; font-weight: 500;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: transparent; color: var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-pri {
  background: var(--liquorice); color: var(--cream);
  border-color: var(--liquorice);
}
.btn-pri:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-acc {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 600;
}
.btn-acc:hover { background: var(--ink); color: var(--accent); border-color: var(--ink); }
.btn-icon {
  width: 36px; height: 36px; padding: 0;
  display: grid; place-items: center;
  border-radius: 50%;
}

/* SEARCH */
.search {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  width: 240px;
  font-size: 13px;
}
.search input {
  border: none; outline: none; background: none;
  flex: 1; font: inherit; color: inherit;
}
.search input::placeholder { color: var(--ink-3); }

/* CARDS */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--card-pad);
  position: relative;
}
.card-h {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.card-title-serif {
  font-family: var(--serif); font-weight: 300;
  font-size: 22px; letter-spacing: -0.01em;
}
.card-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* SECTION */
.sec { margin-bottom: 28px; }
.sec-h {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px; gap: 16px;
}
.sec-title {
  font-family: var(--serif);
  font-size: 28px; line-height: 1;
  font-weight: 300; letter-spacing: -0.01em;
  color: var(--ink);
}
.sec-title em { font-style: italic; }
.sec-sub { font-size: 12px; color: var(--ink-3); }

/* PILLS */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.01em;
  border: 1px solid var(--line-2);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.pill-on { background: rgba(143,199,102,0.18); color: #1d4a14; border-color: rgba(143,199,102,0.4); }
.pill-on .dot { background: var(--positive); }
.pill-warn { background: rgba(255,153,71,0.18); color: #6b2f06; border-color: rgba(255,153,71,0.4); }
.pill-warn .dot { background: var(--warning); }
.pill-danger { background: rgba(184,57,43,0.12); color: var(--danger); border-color: rgba(184,57,43,0.3); }
.pill-danger .dot { background: var(--danger); }
.pill-ghost { background: transparent; color: var(--ink-2); }
.pill-ink { background: var(--liquorice); color: var(--cream); border-color: var(--liquorice); }
.pill-acc { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

[data-theme="dark"] .pill-on { background: rgba(143,199,102,0.18); color: #b6e29a; }
[data-theme="dark"] .pill-warn { background: rgba(255,153,71,0.18); color: #f3b07a; }
[data-theme="dark"] .pill-danger { background: rgba(242,166,168,0.18); color: #f2a6a8; }

/* KPI */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 28px;
}
.kpi {
  background: var(--surface);
  padding: 18px 20px 16px;
}
.kpi-lbl {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 10px;
}
.kpi-val {
  font-family: var(--serif);
  font-size: 36px; line-height: 1;
  font-weight: 300; letter-spacing: -0.02em;
  color: var(--ink);
}
.kpi-val .unit { font-size: 18px; color: var(--ink-3); margin-left: 2px; }
.kpi-foot {
  margin-top: 8px;
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ink-3);
}
.kpi-delta { font-weight: 600; }
.kpi-delta.up { color: var(--positive); }
.kpi-delta.dn { color: var(--danger); }

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-12 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-21 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }

/* CAMPAIGN CARD (big, on overview) */
.cmp-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all .18s;
  display: flex; flex-direction: column;
  min-height: 280px;
}
.cmp-card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.cmp-card.ft-1 { background: var(--orange); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-2 { background: var(--blossom); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-3 { background: var(--sky); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-4 { background: var(--pear); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-5 { background: var(--lilac); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-6 { background: var(--orange); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-ink { background: var(--liquorice); color: var(--cream); border-color: transparent; }

.cmp-card .partner-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.cmp-card .partner {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  opacity: 0.75;
}
.cmp-card .series {
  font-family: var(--serif); font-size: 32px;
  line-height: 1; font-weight: 300;
  letter-spacing: -0.015em;
  margin: 8px 0 16px;
}
.cmp-card .series em { font-style: italic; }
.cmp-pacing { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
.pace-row { display: flex; flex-direction: column; gap: 6px; }
.pace-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; font-weight: 500;
}
.pace-meta .pl { opacity: 0.7; }
.pace-meta .pv { font-weight: 600; }
.pace-bar {
  height: 4px; background: rgba(36,28,23,0.18);
  border-radius: 999px; overflow: hidden;
  position: relative;
}
.pace-bar > i {
  display: block; height: 100%;
  background: var(--liquorice);
  border-radius: 999px;
}
.pace-bar.on-light > i { background: var(--liquorice); }
.cmp-card .meta-foot {
  display: flex; justify-content: space-between;
  font-size: 11px; opacity: 0.7;
  padding-top: 14px; margin-top: 14px;
  border-top: 1px solid rgba(36,28,23,0.15);
}
.cmp-card .arrow {
  position: absolute; top: 22px; right: 22px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--liquorice); color: var(--cream);
  display: grid; place-items: center;
  transition: transform .18s;
}
.cmp-card.ft-ink .arrow { background: var(--cream); color: var(--liquorice); }
.cmp-card:hover .arrow { transform: translate(2px, -2px) rotate(-10deg); }

/* TOP POSTS */
.posts {
  display: flex; flex-direction: column;
}
.post {
  display: grid;
  grid-template-columns: 28px 1fr 100px 100px 100px 80px;
  align-items: center;
  gap: 16px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .12s;
}
.post:hover { background: var(--bg-soft); }
.post:last-child { border-bottom: none; }
.post .rank {
  font-family: var(--serif); font-size: 22px;
  font-weight: 400; color: var(--ink-3);
  font-style: italic;
}
.post-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.post-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-3); }
.post-quote {
  font-size: 14px; font-weight: 500; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.post-num { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.post-num .lbl { display: block; font-size: 10px; color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }

.post-plat {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg-soft); color: var(--ink);
  font-size: 11px; font-weight: 600;
  border: 1px solid var(--line);
}

/* CHARTS */
.chart-wrap {
  height: 220px;
  position: relative;
}
.chart-tall { height: 280px; }
.chart-short { height: 140px; }

/* CALLOUT */
.callout {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: var(--r-md);
  padding: 16px 18px;
}
.callout.pos { border-left-color: var(--positive); }
.callout.warn { border-left-color: var(--warning); }
.callout.neg { border-left-color: var(--danger); }
.callout.info { border-left-color: var(--sky); }
.callout-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
.callout-body { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

/* SOURCES */
.src-strip {
  display: flex; gap: 24px; flex-wrap: wrap;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 28px;
  font-size: 11px;
}
.src-strip .src-lbl {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3);
  align-self: center;
}
.src-item { display: flex; align-items: center; gap: 6px; }
.src-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--positive); }
.src-item .dot.stale { background: var(--warning); }
.src-item .nm { font-weight: 500; color: var(--ink); }
.src-item .dt { color: var(--ink-3); }

/* TABS / SEGMENTS */
.seg {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: none; background: none; color: var(--ink-3);
  font: inherit; font-size: 12px; font-weight: 500;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.seg button.active { background: var(--liquorice); color: var(--cream); }
.seg button:hover:not(.active) { color: var(--ink); }

/* TABLES */
.tbl {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.tbl td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.tbl tr:last-child td { border-bottom: none; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

/* CHANNEL TILE */
.chan {
  display: flex; flex-direction: column; gap: 8px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.chan-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chan-name {
  font-family: var(--serif); font-size: 22px;
  font-weight: 300; line-height: 1; letter-spacing: -0.01em;
}
.chan-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 8px; }
.chan-stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chan-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 500; }

/* FORMAT BARS */
.fbar { display: flex; flex-direction: column; gap: 12px; }
.fbar-row {
  display: grid; grid-template-columns: 110px 1fr 90px;
  align-items: center; gap: 12px;
}
.fbar-name { font-size: 13px; font-weight: 500; }
.fbar-track { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; position: relative; }
.fbar-fill { height: 100%; border-radius: 999px; }
.fbar-num { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* HERO POST CARD */
.hero-post {
  background: var(--liquorice);
  color: var(--cream);
  border-radius: var(--r-lg);
  padding: 28px;
  display: flex; flex-direction: column; gap: 16px;
  position: relative; overflow: hidden;
}
.hero-post::after {
  content: '';
  position: absolute; right: -40px; top: -40px;
  width: 200px; height: 200px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.1;
}
.hero-post .badge {
  display: inline-flex; align-self: flex-start;
  gap: 6px; align-items: center;

  num(n) {

  pct(n, d = 1) { return n.toFixed(d) + '%'; },
  money(n) {
    if (n >= 1_000) return '$' + (n / 1_000).toFixed(1) + 'K';

    return '$' + Math.round(n).toLocaleString();

  // Full dollar amount with cents (e.g. $1,497.32). Used in episode breakdowns
  // where precise per-platform spend matters.
  moneyFull(n) {
    const v = Number(n) || 0;
    return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

//   • surfaces a copy-paste YAML snippet so the operator can apply the change
//
// On the next refresh the operator updates campaigns.yaml manually and the
// dashboard re-renders with the campaign in the Wrapped section.
// ============================================================
function WrapCampaignButton({ campaign }) {
  const c = campaign;
  const isWrapped = c.lifecycle === 'wrapped';
  const [open, setOpen] = React.useState(false);
  const [endDate, setEndDate] = React.useState(() => new Date().toISOString().slice(0, 10));

  if (isWrapped) {
    return (
      <div style={{
        padding:'8px 12px', borderRadius:'var(--r-md)',

        textAlign:'center', fontWeight:600, textTransform:'uppercase'
      }}>
        ✓ Wrapped
      </div>
    );
  }

  // Generate the YAML edit instructions
  const snippet =
    `# Edit config/campaigns.yaml — find the entry for id: ${c.id}\n` +
    `# Change these two lines:\n` +
    `\n` +
    `    lifecycle: wrapped       # was: active\n` +
    `    flight_end: ${endDate}   # set to actual end date\n` +
    `\n` +
    `# Then run: python -m app.viewer.refresh`;

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(snippet);
      alert('Copied to clipboard. Paste into config/campaigns.yaml.');
    } catch {
      // ignore
    }
  };

  return (
    <>
      <button onClick={() => setOpen(true)} style={{
        padding:'8px 14px', borderRadius:'var(--r-md)',
        background:'var(--bg)', border:'1px solid var(--line)',

        cursor:'pointer', display:'inline-flex', alignItems:'center', gap:6,
        justifyContent:'center'
      }}>
        Mark as wrapped
      </button>

      {open && (
        <div style={{
          position:'fixed', inset:0, zIndex:9999,
          background:'rgba(31,26,21,0.55)', backdropFilter:'blur(4px)',
          display:'flex', alignItems:'center', justifyContent:'center', padding:24
        }} onClick={() => setOpen(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background:'var(--surface)', borderRadius:12, padding:28,
            maxWidth:560, width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)'
          }}>
            <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:8}}>
              Wrap campaign
            </div>
            <div style={{fontFamily:'var(--serif)', fontSize:26, fontWeight:300, letterSpacing:'-0.01em', marginBottom:14}}>
              Mark <em>{c.partner}</em> as wrapped?
            </div>
            <div style={{fontSize:13, color:'var(--ink-2)', lineHeight:1.6, marginBottom:18}}>
              The dashboard is read-only, so it can't edit the config file directly.
              When you confirm, we'll generate the exact two-line YAML edit for you to
              paste into <code>config/campaigns.yaml</code>. On the next refresh,
              this campaign moves from <strong>Active</strong> to <strong>Recently wrapped</strong>:
              the sidebar groups it under Wrapped, and Overview shows a smaller black card
              with only final delivery numbers.
            </div>

            <div style={{
              display:'flex', alignItems:'center', gap:10, marginBottom:18,
              padding:'12px 14px', background:'var(--bg-soft)',
              border:'1px solid var(--line)', borderRadius:8
            }}>
              <span style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', letterSpacing:'0.06em', textTransform:'uppercase', fontFamily:'var(--mono)'}}>Actual end date</span>
              <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)}

              fontFamily:'var(--mono)', whiteSpace:'pre-wrap', wordBreak:'break-word',
              margin:'0 0 18px 0', maxHeight:200, overflowY:'auto'

            <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>

// ============================================================
// SVG LINE CHART
// ============================================================
function MultiLineChart({ data, series, height = 220 }) {
  const W = 760, H = height, P = { t: 18, r: 18, b: 28, l: 36 };
  const xs = data.map((_, i) => i);
  const allVals = data.flatMap(d => series.map(s => d[s.key]));
  const yMax = Math.max(...allVals) * 1.12;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, data.length - 1);
  const y = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);

  const yTicks = 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {/* gridlines */}
      {[...Array(yTicks + 1)].map((_, i) => {
        const v = (yMax / yTicks) * i;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W - P.r} y1={yy} y2={yy} stroke="currentColor" strokeOpacity="0.08"/>
            <text x={P.l - 8} y={yy + 3} fontSize="9" textAnchor="end" fill="currentColor" opacity="0.5">{fmt.num(v)}</text>
          </g>
        );
      })}
      {/* x labels */}
      {data.map((d, i) => (
        <text key={i} x={x(i)} y={H - 8} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.6">{d.m}</text>
      ))}
      {/* lines */}
      {series.map(s => {
        const pts = data.map((d, i) => `${x(i)},${y(d[s.key])}`).join(' ');
        return (
          <g key={s.key}>
            <polyline points={pts} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            {data.map((d, i) => (
              <circle key={i} cx={x(i)} cy={y(d[s.key])} r="3" fill={s.color}/>
            ))}
          </g>
        );
      })}
    </svg>
  );
}

// ============================================================
// SVG DONUT
// ============================================================
function Donut({ data, size = 180, thickness = 28, centerLabel, centerValue }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <g transform={`translate(${size/2},${size/2}) rotate(-90)`}>
        {data.map((d, i) => {
          const len = (d.value / total) * C;
          const dasharray = `${len} ${C - len}`;
          const dashoffset = -acc;
          acc += len;
          return (
            <circle key={i} r={r} fill="none" stroke={d.color}
              strokeWidth={thickness} strokeDasharray={dasharray} strokeDashoffset={dashoffset}/>
          );
        })}
      </g>
      <text x={size/2} y={size/2 - 4} textAnchor="middle"
        fontFamily="var(--serif)" fontSize="32" fill="currentColor">{centerValue}</text>
      <text x={size/2} y={size/2 + 16} textAnchor="middle"
        fontSize="10" fill="currentColor" opacity="0.6"
        style={{textTransform:'uppercase', letterSpacing:'0.1em', fontWeight:600}}>{centerLabel}</text>
    </svg>
  );
}

// ============================================================
// SVG BAR CHART
// ============================================================
function BarChart({ data, height = 220, valKey = 'value' }) {
  const W = 600, H = height, P = { t: 16, r: 16, b: 36, l: 16 };
  const max = Math.max(...data.map(d => d[valKey])) * 1.1;
  const bw = (W - P.l - P.r) / data.length - 8;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {data.map((d, i) => {
        const x = P.l + i * ((W - P.l - P.r) / data.length) + 4;
        const h = (d[valKey] / max) * (H - P.t - P.b);
        const y = H - P.b - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={bw} height={h} rx="6" fill={d.color || 'var(--ink)'} opacity={d.dim ? 0.3 : 1}/>
            <text x={x + bw/2} y={H - 18} fontSize="11" textAnchor="middle" fill="currentColor" opacity="0.7">{d.label}</text>
            <text x={x + bw/2} y={H - 6} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.5">{d.sub || ''}</text>
            <text x={x + bw/2} y={y - 6} fontSize="11" textAnchor="middle" fill="currentColor" fontWeight="600">{fmt.num(d[valKey])}</text>
          </g>
        );
      })}
    </svg>
  );
}

        textAlign:'center', fontSize:13, color:'var(--ink-3)'
      }}>No post-level data available for this episode.</div>
    );
  }
  return (
    <div style={{ borderTop: '1px solid var(--line)' }}>
      <PerPostHeader/>
      {rows.map((p, idx) => (
        <PerPostRow key={idx} p={p} distLabel={distLabel} chColor={chColor}/>
      ))}
      <PerPostTotal rows={rows} total={total}/>
    </div>
  );
}

function PerPostTable({ rows, distLabel, chColor }) {
  // Standalone version used by social campaigns. No outer card here — caller wraps.
  if (!rows || rows.length === 0) {
    return (
      <div className="card" style={{padding:'24px', textAlign:'center', fontSize:13, color:'var(--ink-3)'}}>
        No posts loaded yet for this campaign.
      </div>
    );
  }
  // Compute synthetic total (eng/impr) since there's no episode-level total here.
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const totalImpr = sum('impr');
  const totalEng = sum('eng');
  const total = {
    impr: totalImpr,
    eng: totalEng,
    spend: sum('spend'),
    er: totalImpr ? (totalEng / totalImpr * 100) : 0,
  };
  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden', overflowX: 'auto' }}>
      <PerPostHeader/>
      {rows.map((p, idx) => (
        <PerPostRow key={idx} p={p} distLabel={distLabel} chColor={chColor}/>
      ))}
      <PerPostTotal rows={rows} total={total}/>
    </div>
  );
}

function PerPostHeader() {
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: PER_POST_GRID,
      gap: 10, padding: '14px 16px 12px 24px',

      <div style={{ textAlign: 'right' }}>% Organic</div>
      <div style={{ textAlign: 'right' }}>Eng.</div>
      <div style={{ textAlign: 'right' }}>ER</div>
      <div style={{ textAlign: 'right' }}>Spend</div>
    </div>
  );
}

function PerPostRow({ p, distLabel, chColor }) {
  const dist = distLabel(p.distKind);
  const totalSplit = (p.paidImpr || 0) + (p.orgImpr || 0);
  const orgPct = totalSplit ? (p.orgImpr / totalSplit) * 100 : 0;
  const TitleCell = p.url ? (
    <a href={p.url} target="_blank" rel="noreferrer"
      style={{
        color:'inherit', textDecoration:'none',
        overflow:'hidden', textOverflow:'ellipsis', display:'-webkit-box',

    <div style={{
      overflow:'hidden', textOverflow:'ellipsis', display:'-webkit-box',

    <div style={{
      display: 'grid', gridTemplateColumns: PER_POST_GRID,

      borderBottom: '1px solid var(--line)',

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
        <span style={{ width: 8, height: 8, borderRadius: '50%', background: chColor(p.platform), flexShrink:0 }}/>
        <span style={{ fontSize:12, fontWeight: 500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.platform}</span>
      </div>
      <span style={{
        background: dist.bg, color: dist.fg,
        fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.06em',
        fontWeight: 600, padding: '3px 7px', borderRadius: 3,
        justifySelf: 'start', textTransform: 'uppercase', whiteSpace:'nowrap'
      }}>{dist.txt}</span>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{p.impr ? fmt.numFull(p.impr) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>{p.paidImpr ? fmt.numFull(p.paidImpr) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500, color: '#2f7a3f' }}>{p.orgImpr ? fmt.numFull(p.orgImpr) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>{totalSplit ? orgPct.toFixed(0) + '%' : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>{p.eng ? fmt.numFull(p.eng) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>{p.er ? p.er + '%' : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>{p.spend ? fmt.moneyFull(p.spend) : '—'}</div>
    </div>
  );
}

function PerPostTotal({ rows, total }) {
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const totalImpr = sum('impr');
  const totalPaid = sum('paidImpr');
  const totalOrg = sum('orgImpr');
  const totalEng = sum('eng');
  const totalSpend = sum('spend');
  const denom = totalPaid + totalOrg;
  const orgPct = denom ? (totalOrg / denom) * 100 : 0;
  const totalEr = total?.er ?? (totalImpr ? (totalEng / totalImpr) * 100 : 0);
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: PER_POST_GRID,
      gap: 10, padding: '16px 16px 16px 24px', alignItems: 'center',
      fontSize: 13, background: 'var(--bg-soft)',
      borderTop: '2px solid var(--liquorice)',
      fontWeight: 700
    }}>
      <div style={{
        fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.1em',
        textTransform: 'uppercase', color: 'var(--ink-2)', fontWeight: 700
      }}>Total ({rows.length} post{rows.length === 1 ? '' : 's'})</div>
      <div/>
      <div/>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 700 }}>{totalImpr ? fmt.numFull(totalImpr) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{totalPaid ? fmt.numFull(totalPaid) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', color: '#2f7a3f' }}>{totalOrg ? fmt.numFull(totalOrg) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{denom ? orgPct.toFixed(0) + '%' : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{totalEng ? fmt.numFull(totalEng) : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{totalImpr ? totalEr.toFixed(2) + '%' : '—'}</div>
      <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{totalSpend ? fmt.moneyFull(totalSpend) : '—'}</div>
    </div>
  );
}

// expose
Object.assign(window, {
  Ic, PlatformPill, Sidebar, PageHead, PaceBar, CampaignCard, WrappedCard,
  WrapCampaignButton, MultiLineChart, Donut, BarChart, PLATFORM_COLORS,
  EpisodePerformanceTable, PerPostTable
});

  // Per-campaign channels (with YouTube split into In-feed + Pre-roll).

  const channels = (c.channels && c.channels.length > 0)

    c.color === 'ft-6' ? { bg: 'var(--flame)', fg: 'var(--paper)', dim: 'rgba(250,247,239,0.75)', track: 'rgba(250,247,239,0.2)', fill: 'var(--paper)' } :
    { bg: 'var(--liquorice)', fg: 'var(--cream)', dim: 'rgba(245,241,232,0.7)', track: 'rgba(245,241,232,0.2)', fill: 'var(--cream)' };

          const orderIndex = (arr, name) => {

          const renderTile = (ch) => {

                      </span>
                    </span>
                  </div>

                        ${ch.bench.cpm.toFixed(2)} <span style={{color: cpmDiff > 0 ? 'var(--danger)' : 'var(--positive)', fontWeight:600, marginLeft:4}}>
                          {cpmDiff > 0 ? '+' : ''}{cpmDiff.toFixed(0)}%
                        </span>
                      </span>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          // ≤4 channels: render all on one row, sorted by ROW_1_ORDER then ROW_2_ORDER then impressions
          if (channels.length <= 4) {
            const ordered = [...channels].sort((a, b) => {
              const ai = orderIndex(ROW_1_ORDER, a.name);
              const bi = orderIndex(ROW_1_ORDER, b.name);
              if (ai !== bi) return ai - bi;
              const aj = orderIndex(ROW_2_ORDER, a.name);
              const bj = orderIndex(ROW_2_ORDER, b.name);
              if (aj !== bj) return aj - bj;
              return b.impressions - a.impressions;

            return (
              <div style={{display:'grid', gridTemplateColumns:`repeat(${ordered.length}, minmax(0, 1fr))`, gap:10}}>

          const row2Set = new Set(ROW_1_ORDER);
          const row2 = channels
            .filter(c => !row2Set.has(c.name))
            .sort((a, b) => {
              const ai = orderIndex(ROW_2_ORDER, a.name);
              const bi = orderIndex(ROW_2_ORDER, b.name);
              if (ai !== bi) return ai - bi;
              return b.impressions - a.impressions;
            });
          return (
            <>
              {row1.length > 0 && (
                <div style={{display:'grid', gridTemplateColumns:`repeat(${row1.length}, minmax(0, 1fr))`, gap:10, marginBottom:10}}>
                  {row1.map(renderTile)}

              {row2.length > 0 && (
                <div style={{display:'grid', gridTemplateColumns:`repeat(${row2.length}, minmax(0, 1fr))`, gap:10, marginBottom:16}}>
                  {row2.map(renderTile)}
                </div>
              )}
            </>
          );
        })()}
      </div>
    </>
  );
}

// Tiny custom curve chart with goal line
function DeliveryCurve({ campaign }) {
  const W = 600, H = 240, P = { t: 16, r: 16, b: 30, l: 32 };
  const weeks = 16;
  const goal = campaign.impressions.goal;
  const progress = campaign.impressions.delivered / goal;
  const elapsed = campaign.elapsedPct / 100;

  const ideal = Array.from({length: weeks + 1}, (_, i) => (i / weeks) * goal);
  const actual = Array.from({length: weeks + 1}, (_, i) => {
    if (i / weeks > elapsed + 0.05) return null;
    const t = i / weeks / Math.max(0.01, elapsed);
    const noise = Math.sin(i * 1.3) * 0.04;
    return Math.min(goal, t * progress * goal + noise * goal);
  });

  const yMax = goal * 1.05;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / weeks;
  const y = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
        const v = p * yMax;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="currentColor" strokeOpacity="0.08"/>
            <text x={P.l-6} y={yy+3} fontSize="9" textAnchor="end" fill="currentColor" opacity="0.5">{fmt.num(v)}</text>
          </g>
        );
      })}
      <line x1={P.l} x2={W-P.r} y1={y(goal)} y2={y(goal)} stroke="var(--ink)" strokeWidth="1" strokeDasharray="3 3" opacity="0.5"/>
      <text x={W-P.r} y={y(goal)-6} fontSize="10" textAnchor="end" fill="currentColor" fontWeight="600">Goal {fmt.num(goal)}</text>
      <polyline points={ideal.map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--ink-3)" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.6"/>
      <polyline points={actual.filter(v => v !== null).map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--flame)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1={x(weeks * elapsed)} x2={x(weeks * elapsed)}
        y1={P.t} y2={H-P.b} stroke="var(--ink)" strokeWidth="1" opacity="0.4"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="5" fill="var(--flame)"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="9" fill="var(--flame)" opacity="0.2"/>
      {[0, 4, 8, 12, 16].map(w => (
        <text key={w} x={x(w)} y={H-12} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.6">W{w + 1}</text>
      ))}
      <text x={x(weeks * elapsed)} y={P.t-2} fontSize="9" textAnchor="middle" fill="currentColor" fontWeight="600">Today</text>
    </svg>
  );
}

window.CampaignPage = CampaignPage;

// ── Pacing pill ─────────────────────────────────────────────
function PaceBarUB({ pct, color, track }) {
  return (
    <div style={{height:8, background: track || 'rgba(31,26,21,0.12)', borderRadius:999, overflow:'hidden', position:'relative'}}>
      <div style={{height:'100%', width: Math.min(100,pct)+'%', background: color, borderRadius:999}}/>
      {pct > 100 && (
        <div style={{position:'absolute', top:0, right:0, height:'100%', width:'4px', background:'var(--liquorice)'}}/>
      )}
    </div>
  );
}

// ── Master pacing — stacked bar ─────────────────────────────
function MasterPacing() {
  const total = UB_COMPONENTS.reduce((s,c) => s + c.impressions.delivered, 0);
  const goal = UB_COMPONENTS.reduce((s,c) => s + c.impressions.goal, 0);
  const spent = UB_COMPONENTS.reduce((s,c) => s + c.budget.delivered, 0);
  const budget = UB_COMPONENTS.reduce((s,c) => s + c.budget.goal, 0);
  const overall = (total / goal) * 100;
  const overallBud = (spent / budget) * 100;

  return (
    <div className="card" style={{marginBottom:24, padding:28}}>
      <div className="card-h" style={{marginBottom:18}}>
        <div>
          <div className="card-title-serif">Total <em>campaign pacing</em></div>
          <div className="card-sub">Combined progress across all 3 social components toward 14M impression goal.</div>
        </div>
        <span className="pill" style={{
          background:'rgba(143,199,102,0.18)', color:'#2f7a3f', border:'none', fontWeight:600
        }}>
          <span className="dot" style={{background:'#2f7a3f'}}/>Goal Exceeded
        </span>
      </div>

      {/* Stacked bar */}
      <div style={{position:'relative', marginBottom:10}}>
        <div style={{height:36, background:'var(--bg-soft)', borderRadius:8, overflow:'hidden', display:'flex'}}>
          {UB_COMPONENTS.map(c => {
            const pct = (c.impressions.delivered / goal) * 100;
            return (
              <div key={c.id} style={{width: pct+'%', background: c.color, height:'100%', position:'relative'}}>
                {pct > 8 && (
                  <div style={{
                    position:'absolute', inset:0, display:'flex', alignItems:'center', padding:'0 12px',
                    color: c.fg, fontSize: 11, fontWeight:600, fontFamily:'var(--mono)', letterSpacing:'0.05em'
                  }}>{fmt.num(c.impressions.delivered)}</div>
                )}
              </div>
            );
          })}
        </div>
        {/* Goal marker */}
        <div style={{position:'absolute', top:-6, bottom:-6, left:'100%', width:2, background:'var(--ink)', opacity:0.7}}>
          <span style={{position:'absolute', top:-18, right:0, fontSize:10, fontFamily:'var(--mono)', fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap'}}>14M GOAL</span>
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', fontSize:12, color:'var(--ink-2)', marginBottom:18}}>
        <span><strong style={{color:'var(--ink)'}}>{fmt.num(total)}</strong> of {fmt.num(goal)} impressions
          (<strong style={{color:'#2f7a3f'}}>{overall.toFixed(1)}% — Goal Exceeded</strong>)</span>
        <span style={{color:'var(--ink-3)'}}>{fmt.money(spent)} of {fmt.money(budget)} spent · {overallBud.toFixed(1)}%</span>
      </div>

      {/* Legend */}
      <div style={{display:'flex', gap:20, flexWrap:'wrap', fontSize:12, paddingTop:16, borderTop:'1px solid var(--line)'}}>
        {UB_COMPONENTS.map(c => (
          <div key={c.id} style={{display:'flex', alignItems:'center', gap:8}}>
            <div style={{width:12, height:12, borderRadius:3, background:c.color}}/>
            <span><strong style={{color:'var(--ink)'}}>Component {c.n}:</strong> {c.title} — {fmt.num(c.impressions.delivered)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Platform performance table ──────────────────────────────
function PlatformTable({ comp }) {
  const totals = comp.platforms.reduce((acc, p) => ({
    posts: acc.posts + p.posts,
    organic: acc.organic + (p.organic || 0),
    paid: acc.paid + (p.paid || 0),
    total: acc.total + p.total,
    eng: acc.eng + p.eng,
    spend: acc.spend + p.spend,
    est: acc.est + (p.est || 0)
  }), { posts:0, organic:0, paid:0, total:0, eng:0, spend:0, est:0 });
  const totalEr = (totals.eng / totals.total) * 100;
  const totalPct = totals.est > 0 ? (totals.spend / totals.est) * 100 : null;

  return (
    <div style={{overflowX:'auto', border:'1px solid var(--line)', borderRadius:'var(--r-lg)', background:'var(--surface)'}}>
      <table style={{width:'100%', borderCollapse:'collapse', fontSize:12}}>
        <thead>
          <tr style={{background:'var(--bg-soft)', borderBottom:'1px solid var(--line)'}}>
            {['Platform','Posts','Organic','Paid','Total','Eng.','ER','Spend','Est.','% Spent'].map((h, i) => (
              <th key={h} style={{
                padding:'12px 14px', textAlign: i === 0 ? 'left' : 'right',
                fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
                fontWeight:600, color:'var(--ink-3)'
              }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {comp.platforms.map((p, idx) => (
            <tr key={p.name} style={{borderBottom:'1px solid var(--line)'}}>
              <td style={{padding:'12px 14px', fontWeight:500}}>{p.name}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{p.posts}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color:'var(--ink-2)'}}>{fmt.num(p.organic)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color:'var(--ink-2)'}}>{p.paid === null ? '—' : fmt.num(p.paid)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmt.num(p.total)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(p.eng)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color: p.er >= 5 ? '#2f7a3f' : 'var(--ink-2)', fontWeight: p.er >= 5 ? 600 : 400}}>{p.er.toFixed(p.er < 1 ? 2 : 1)}%</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{p.spend === 0 ? '—' : '$'+fmt.num(Math.round(p.spend))}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color:'var(--ink-3)'}}>{!p.est ? '—' : '$'+fmt.num(p.est)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color: p.pct === null ? 'var(--ink-3)' : p.pct > 110 ? '#b8392b' : p.pct < 80 ? '#a06b14' : 'var(--ink-2)', fontWeight: p.pct !== null && (p.pct > 110 || p.pct < 80) ? 600 : 400}}>{p.pct === null ? '—' : p.pct.toFixed(1)+'%'}</td>
            </tr>
          ))}
          <tr style={{background:'var(--liquorice)', color:'var(--cream)'}}>
            <td style={{padding:'14px', fontWeight:600, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase'}}>Total</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{totals.posts}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(totals.organic)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(totals.paid)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmt.num(totals.total)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(totals.eng)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{totalEr.toFixed(1)}%</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>${fmt.num(Math.round(totals.spend))}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{totals.est === 0 ? '—' : '$'+fmt.num(totals.est)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600, color: totalPct && totalPct > 110 ? '#ffcccb' : 'var(--cream)'}}>{totalPct === null ? '—' : totalPct.toFixed(1)+'%'}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

          <div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
              <span style={{fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-3)'}}>Spend</span>
              <span style={{fontSize:12, color:'var(--ink-2)'}}>
                <strong style={{color:'var(--ink)'}}>{fmt.money(comp.budget.delivered)}</strong> of {fmt.money(comp.budget.goal)}
                <span style={{marginLeft:8, color: budPct > 110 ? '#b8392b' : budPct < 50 ? '#a06b14' : 'var(--ink-2)', fontWeight:600}}>{budPct.toFixed(1)}%</span>
              </span>
            </div>
            <PaceBarUB pct={budPct} color={budPct > 110 ? 'var(--flame)' : 'var(--liquorice)'}/>
          </div>
        </div>
        {comp.budgetNote && (
          <div style={{
            marginTop:14, padding:'10px 14px',
            background:'rgba(255,206,0,0.14)', border:'1px solid rgba(255,206,0,0.3)',
            borderRadius:8, fontSize:12, color:'var(--ink-2)', lineHeight:1.5
          }}>
            <strong style={{color:'var(--ink)'}}>Budget note: </strong>{comp.budgetNote}
          </div>
        )}
      </div>

      {/* KPIs */}
      <div className="kpi-row" style={{gridTemplateColumns:'repeat(5, 1fr)'}}>
        <div className="kpi"><div className="kpi-lbl">Posts Live</div><div className="kpi-val">{comp.posts}</div><div className="kpi-foot"><span className="muted">{comp.sub.split('·')[0].trim().toLowerCase()}</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Impressions</div><div className="kpi-val">{fmt.num(comp.impressions.delivered)}</div><div className="kpi-foot"><span className="muted">{impPct.toFixed(1)}% of goal</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Engagements</div><div className="kpi-val">{fmt.num(comp.engagements)}</div><div className="kpi-foot"><span className="muted">cross-platform</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Eng. Rate</div><div className="kpi-val">{comp.er}<span className="unit">%</span></div><div className="kpi-foot"><span className="muted">blended</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Spend</div><div className="kpi-val">{fmt.money(comp.budget.delivered)}</div><div className="kpi-foot"><span className="muted">of {fmt.money(comp.budget.goal)} ({budPct.toFixed(0)}%)</span></div></div>
      </div>

      {/* Platform performance table */}
      {comp.platforms && (
        <div style={{marginTop:24, marginBottom:18}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Platform <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>
            Engagements = MS social engagements + Google Ads YT Shorts engagements combined. Paid impressions sourced from Meta Ads Manager (IG/FB), X Ads Manager, and Google Ads (YT Shorts). Organic from Measure Studio.
          </div>
          <PlatformTable comp={comp}/>
        </div>
      )}

      {/* Stories (Come Up) or Videos (Red Carpet) */}
      {comp.stories && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Story <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14}}>4 stories × 5 platforms = 20 posts. Click any row to see the platform breakdown.</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {comp.stories.map(s => <StoryCard key={s.name} story={s} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {comp.videos && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Per-video <em>detail</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>2 videos across 5 platforms. Video 1 is organic boosted with paid amplification. Video 2 is paid-only (dark) — no organic delivery anywhere.</div>
          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            {comp.videos.map(v => <VideoCard key={v.name} video={v} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {/* Callouts */}
      <div style={{marginTop:24}}>
        <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:14}}>What we're <em>seeing</em></div>
        <div style={{display:'grid', gridTemplateColumns: comp.callouts.length === 1 ? '1fr' : `repeat(${comp.callouts.length}, 1fr)`, gap:14}}>
          {comp.callouts.map((co, i) => <Callout key={i} co={co}/>)}
        </div>
      </div>
    </div>
  );
}

// ── Main page ───────────────────────────────────────────────
function UsBankPage({ campaignId, onBack }) {
  const c = CAMPAIGNS.find(x => x.id === 'usbank');
  const [activeComp, setActiveComp] = useStateUB(null);

  const scrollTo = (id) => {
    const el = document.getElementById(`comp-${id}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    setActiveComp(id);
  };

  return (
    <>
      <PageHead
        overline={onBack ? (
          <>
            <span style={{cursor:'pointer'}} onClick={onBack}><Ic.back/> Overview</span>
            <span style={{margin:'0 8px', opacity:0.4}}>/</span>
            <span>{c.partner}</span>
          </>
        ) : (
          // Standalone US Bank document — no Overview to navigate back to.
          // Show the partner alone, no breadcrumb.
          <span style={{
            fontSize:11, letterSpacing:'0.16em', textTransform:'uppercase',
            fontWeight:600, color:'var(--ink-3)'
          }}>{c.partner}</span>
        )}
        title="NFL"
        italic="Draft"
        sub={<>Partner: <strong>US Bank</strong> · Flight: {c.flight} · 3 social components · <strong>38 posts live</strong> across IG, FB, X, LinkedIn, YouTube Shorts</>}
        actions={<>
          <button className="btn btn-acc"><Ic.download/> Export</button>
        </>}
      />

      {/* Hero — 3-component overview */}
      <div style={{marginBottom:24}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14}}>
          <div>
            <div style={{fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:6, textTransform:'uppercase'}}>
              Three Social Components
            </div>
            <div style={{fontFamily:'var(--serif)', fontSize:28, fontWeight:300, letterSpacing:'-0.01em'}}>
              Each tracked <em>independently.</em>
            </div>
          </div>
          <div style={{fontSize:12, color:'var(--ink-3)', maxWidth:380, textAlign:'right', lineHeight:1.5}}>
            Click a component to jump to its full breakdown. Each has its own goal, budget, and post inventory.
          </div>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14}}>
          {UB_COMPONENTS.map(comp => (
            <ComponentCard key={comp.id} comp={comp} active={activeComp === comp.id} onClick={() => scrollTo(comp.id)}/>
          ))}
        </div>
      </div>

      {/* Master pacing — stacked */}
      <MasterPacing/>

      {/* Component sections */}
      {UB_COMPONENTS.map((comp, idx) => (
        <React.Fragment key={comp.id}>
          {idx > 0 && <div style={{height:1, background:'var(--line)', margin:'32px 0'}}/>}
          <ComponentSection comp={comp}/>
        </React.Fragment>
      ))}

      {/* Data sources footer */}
      <div className="sec" style={{marginTop:32}}>
        <div className="card" style={{padding:22, background:'var(--bg-soft)'}}>
          <div style={{fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:8, textTransform:'uppercase'}}>Data Sources</div>
          <div style={{fontSize:12, color:'var(--ink-2)', lineHeight:1.6}}>
            Social metrics from Measure Studio export (April 27, 2026) — 20 Come Up posts, 10 Native Social Coverage posts, 6 Red Carpet posts (+ 2 dark posts via Ads Managers).
            Paid data from Meta Ads Manager (IG/FB), X Ads Manager, Google Ads (YT Shorts). Organic from Measure Studio.
            Total spend: <strong style={{color:'var(--ink)'}}>$30,986 of $31,375 (98.8%)</strong>.
            Total delivery: <strong style={{color:'var(--ink)'}}>14.51M of 14.0M (103.6% — Goal Exceeded)</strong>.
          </div>
        </div>
      </div>
    </>
  );
}

window.UsBankPage = UsBankPage;

</script>

<script type="text/babel">
// Minimal app shell — boots directly into the US Bank page with no sidebar
// and no view router. This is a single-purpose standalone document for sharing
// the US Bank case study independently of the main 4-campaign dashboard.
function App() {
  return (
    <div className="app standalone">
      <main className="main" data-screen-label="US Bank x NFL Draft">
        <UsBankPage campaignId="usbank" />
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
