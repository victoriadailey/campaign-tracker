      {/* TOP POSTS — per-campaign. Hidden entirely when neither list has a
          qualifier (no posts ≥2% ER OR no posts ≥100K organic reach), since
          showing empty tiles with placeholder copy adds noise. The visible
          column count adapts to whichever side has data. */}
      {((c.topPosts && c.topPosts.length > 0) || (c.topPostsOrganic && c.topPostsOrganic.length > 0)) && (
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">Top <em>posts</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Best-performing assets on this campaign. Click any row to open.</div>
          </div>
        </div>
        {(() => {
          const showEr = c.topPosts && c.topPosts.length > 0;
          const showOrg = c.topPostsOrganic && c.topPostsOrganic.length > 0;
          const cols = (showEr && showOrg) ? '1fr 1fr' : '1fr';
          return (
        <div style={{display:'grid', gridTemplateColumns:cols, gap:14}}>
          {/* By engagement rate — only when at least one qualifier exists */}
          {showEr && (
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'18px 22px 14px', borderBottom:'1px solid var(--line)'}}>
              <div className="card-title-serif" style={{fontSize:20}}>By <em>engagement rate</em></div>
              <div style={{fontSize:11, color:'var(--ink-3)', marginTop:4}}>Min 1K views, ER ≥ 2% — ranked by ER%</div>
            </div>
            {c.topPosts.slice(0, 5).map((p, idx, arr) => (
              <a key={p.id || idx} href={p.url || '#'} target="_blank" rel="noreferrer"
                style={{
                  display:'grid', gridTemplateColumns:'28px 1fr 100px 70px 18px', gap:12,
                  padding:'14px 22px', alignItems:'center',
                  borderBottom: idx < arr.length - 1 ? '1px solid var(--line)' : 'none',
                  textDecoration:'none', color:'inherit', cursor:'pointer',
                  transition:'background 0.15s'
                }}
                onMouseEnter={(ev) => ev.currentTarget.style.background = 'var(--bg-soft)'}
                onMouseLeave={(ev) => ev.currentTarget.style.background = ''}>
                <div style={{fontFamily:'var(--mono)', fontSize:11, fontWeight:600, color:'var(--ink-3)', letterSpacing:'0.04em'}}>{String(p.rank || idx + 1).padStart(2,'0')}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:500, marginBottom:3, lineHeight:1.35, overflow:'hidden', textOverflow:'ellipsis', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical'}}>{p.quote}</div>
                  <div style={{fontSize:10, color:'var(--ink-3)'}}>{p.format}</div>
                </div>
                <div><PlatformPill name={p.platform}/></div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontVariantNumeric:'tabular-nums', fontWeight:600, fontSize:15}}>{p.er.toFixed(2)}<span style={{fontSize:10, color:'var(--ink-3)'}}>%</span></div>
                  <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600}}>ER</div>
                </div>
                <div style={{color:'var(--ink-3)', display:'flex', justifyContent:'flex-end'}}><Ic.ext/></div>
              </a>
            ))}
          </div>
          )}

          {/* By organic reach — only when at least one qualifier exists */}
          {showOrg && (
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'18px 22px 14px', borderBottom:'1px solid var(--line)'}}>
              <div className="card-title-serif" style={{fontSize:20}}>By <em>organic reach</em></div>
              <div style={{fontSize:11, color:'var(--ink-3)', marginTop:4}}>Min 100K organic — ranked by organic reach</div>
            </div>
            {c.topPostsOrganic.slice(0, 5).map((p, idx, arr) => (
              <a key={p.id || idx} href={p.url || '#'} target="_blank" rel="noreferrer"

                  display:'grid', gridTemplateColumns:'28px 1fr 100px 90px 18px', gap:12,

                  textDecoration:'none', color:'inherit', cursor:'pointer',

                <div style={{fontFamily:'var(--mono)', fontSize:11, fontWeight:600, color:'var(--ink-3)', letterSpacing:'0.04em'}}>{String(p.rank || idx + 1).padStart(2,'0')}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:500, marginBottom:3, lineHeight:1.35, overflow:'hidden', textOverflow:'ellipsis', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical'}}>{p.quote}</div>
                  <div style={{fontSize:10, color:'var(--ink-3)'}}>{p.format} · {p.organicPct}% organic</div>

                  <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600}}>Organic</div>
                </div>
                <div style={{color:'var(--ink-3)', display:'flex', justifyContent:'flex-end'}}><Ic.ext/></div>
              </a>
            ))}
          </div>
          )}
        </div>
          );
        })()}
      </div>
      )}

      {/* CHANNELS — moved to bottom per spec. Layout:
            ≤4 channels  → single row (one per column)
            ≥5 channels  → two rows, YT/IG family on top, others below */}
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">By <em>channel</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Reach, engagement, and CPM with platform benchmarks.</div>
          </div>
        </div>

        {(() => {
          const ROW_1_ORDER = ['YouTube In-feed', 'YouTube Pre-roll', 'YouTube Shorts', 'Instagram', 'Instagram Stories'];
          const ROW_2_ORDER = ['X', 'LinkedIn', 'TikTok', 'Facebook'];
          const orderIndex = (arr, name) => {
            const i = arr.indexOf(name);
            return i === -1 ? 999 : i;
          };

          const renderTile = (ch) => {
            const erDiff = ch.er - ch.bench.er;
            const cpmDiff = ch.bench.cpm > 0 ? ((ch.cpm - ch.bench.cpm) / ch.bench.cpm) * 100 : 0;
            return (
              <div key={ch.name} className="chan">
                <div className="chan-h">
                  <div className="chan-name">
                    <em style={{fontStyle:'italic'}}>{ch.name}</em>
                  </div>
                  <span style={{ width: 12, height: 12, borderRadius: '50%', background: ch.color }}/>
                </div>
                <div className="chan-stats">
                  <div className="chan-stat"><div className="v">{fmt.num(ch.impressions)}</div><div className="l">Impr.</div></div>
                  <div className="chan-stat"><div className="v">{fmt.num(ch.eng)}</div><div className="l">Eng.</div></div>
                  <div className="chan-stat"><div className="v">{ch.er}<span style={{fontSize:11, color:'var(--ink-3)'}}>%</span></div><div className="l">ER</div></div>
                  <div className="chan-stat"><div className="v">{ch.cpm === 0 ? '—' : '$'+ch.cpm}</div><div className="l">CPM</div></div>
                </div>
                <div style={{
                  marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--line)',
                  display:'flex', flexDirection:'column', gap: 5
                }}>
                  <div style={{display:'flex', justifyContent:'space-between', fontSize: 11}}>
                    <span style={{color:'var(--ink-3)'}}>ER bench</span>
                    <span style={{fontWeight:500, color:'var(--ink-2)'}}>
                      {ch.bench.er}% <span style={{color: erDiff > 0 ? 'var(--positive)' : 'var(--danger)', fontWeight:600, marginLeft:4}}>
                        {erDiff > 0 ? '+' : ''}{erDiff.toFixed(1)}
                      </span>
                    </span>
                  </div>
                  {ch.bench.cpm > 0 && ch.cpm > 0 && (
                    <div style={{display:'flex', justifyContent:'space-between', fontSize: 11}}>
                      <span style={{color:'var(--ink-3)'}}>CPM bench</span>
                      <span style={{fontWeight:500, color:'var(--ink-2)'}}>
                        ${ch.bench.cpm.toFixed(2)} <span style={{color: cpmDiff > 0 ? 'var(--danger)' : 'var(--positive)', fontWeight:600, marginLeft:4}}>
                          {cpmDiff > 0 ? '+' : ''}{cpmDiff.toFixed(0)}%
                        </span>
                      </span>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          // ≤4 channels: render all on one row, sorted by ROW_1_ORDER then ROW_2_ORDER then impressions
          if (channels.length <= 4) {
            const ordered = [...channels].sort((a, b) => {
              const ai = orderIndex(ROW_1_ORDER, a.name);
              const bi = orderIndex(ROW_1_ORDER, b.name);
              if (ai !== bi) return ai - bi;
              const aj = orderIndex(ROW_2_ORDER, a.name);
              const bj = orderIndex(ROW_2_ORDER, b.name);
              if (aj !== bj) return aj - bj;
              return b.impressions - a.impressions;
            });
            return (
              <div style={{display:'grid', gridTemplateColumns:`repeat(${ordered.length}, minmax(0, 1fr))`, gap:10}}>
                {ordered.map(renderTile)}
              </div>
            );
          }

          // ≥5 channels: split into two rows (YouTube/Instagram family on top, rest below)
          const row1 = channels
            .filter(c => ROW_1_ORDER.includes(c.name))
            .sort((a, b) => orderIndex(ROW_1_ORDER, a.name) - orderIndex(ROW_1_ORDER, b.name));
          const row2Set = new Set(ROW_1_ORDER);
          const row2 = channels
            .filter(c => !row2Set.has(c.name))
            .sort((a, b) => {
              const ai = orderIndex(ROW_2_ORDER, a.name);
              const bi = orderIndex(ROW_2_ORDER, b.name);
              if (ai !== bi) return ai - bi;
              return b.impressions - a.impressions;
            });
          return (
            <>
              {row1.length > 0 && (
                <div style={{display:'grid', gridTemplateColumns:`repeat(${row1.length}, minmax(0, 1fr))`, gap:10, marginBottom:10}}>
                  {row1.map(renderTile)}
                </div>
              )}
              {row2.length > 0 && (
                <div style={{display:'grid', gridTemplateColumns:`repeat(${row2.length}, minmax(0, 1fr))`, gap:10, marginBottom:16}}>
                  {row2.map(renderTile)}
                </div>
              )}
            </>
          );
        })()}
      </div>
    </>
  );
}

// Tiny custom curve chart with goal line
function DeliveryCurve({ campaign }) {
  const W = 600, H = 240, P = { t: 16, r: 16, b: 30, l: 32 };
  const weeks = 16;
  const goal = campaign.impressions.goal;
  const progress = campaign.impressions.delivered / goal;
  const elapsed = campaign.elapsedPct / 100;

  const ideal = Array.from({length: weeks + 1}, (_, i) => (i / weeks) * goal);
  const actual = Array.from({length: weeks + 1}, (_, i) => {
    if (i / weeks > elapsed + 0.05) return null;
    const t = i / weeks / Math.max(0.01, elapsed);
    const noise = Math.sin(i * 1.3) * 0.04;
    return Math.min(goal, t * progress * goal + noise * goal);
  });

  const yMax = goal * 1.05;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / weeks;
  const y = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
        const v = p * yMax;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="currentColor" strokeOpacity="0.08"/>
            <text x={P.l-6} y={yy+3} fontSize="9" textAnchor="end" fill="currentColor" opacity="0.5">{fmt.num(v)}</text>
          </g>
        );
      })}
      <line x1={P.l} x2={W-P.r} y1={y(goal)} y2={y(goal)} stroke="var(--ink)" strokeWidth="1" strokeDasharray="3 3" opacity="0.5"/>
      <text x={W-P.r} y={y(goal)-6} fontSize="10" textAnchor="end" fill="currentColor" fontWeight="600">Goal {fmt.num(goal)}</text>
      <polyline points={ideal.map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--ink-3)" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.6"/>
      <polyline points={actual.filter(v => v !== null).map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--flame)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1={x(weeks * elapsed)} x2={x(weeks * elapsed)}
        y1={P.t} y2={H-P.b} stroke="var(--ink)" strokeWidth="1" opacity="0.4"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="5" fill="var(--flame)"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="9" fill="var(--flame)" opacity="0.2"/>
      {[0, 4, 8, 12, 16].map(w => (
        <text key={w} x={x(w)} y={H-12} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.6">W{w + 1}</text>
      ))}
      <text x={x(weeks * elapsed)} y={P.t-2} fontSize="9" textAnchor="middle" fill="currentColor" fontWeight="600">Today</text>
    </svg>
  );
}


// =============================================================================
// BrandXCampaignPage — paid-social performance campaigns
// =============================================================================
// Optimization target is efficiency + clicks, not engagement or organic reach.
// Page layout:
//   1. Hero card with the headline KPIs: impressions, ad spend, clicks
//   2. By-channel breakdown (CPM / CTR / CPC efficiency per platform)
//   3. Per-post performance table — every paid asset, sortable columns
// No episodes, no episode comparison, no organic-reach signals.

function BrandXCampaignPage({ c, onBack }) {
  const posts = (window.POSTS_BY_CAMPAIGN || {})[c.id] || [];
  const channels = c.channels || [];

  // Aggregate KPIs across all posts in the campaign
  const totalImpr = posts.reduce((s, p) => s + (p.impr || 0), 0);
  const totalSpend = posts.reduce((s, p) => s + (p.spend || 0), 0);
  const totalClicks = posts.reduce((s, p) => s + (p.clicks || 0), 0);
  const blendedCPM = totalImpr ? (totalSpend / totalImpr * 1000) : 0;
  const blendedCPC = totalClicks ? (totalSpend / totalClicks) : 0;
  const blendedCTR = totalImpr ? (totalClicks / totalImpr * 100) : 0;

  const impPct = c.impressions.goal ? (totalImpr / c.impressions.goal * 100) : 0;
  const budPct = c.budget.goal ? (totalSpend / c.budget.goal * 100) : 0;
  const elapsedPct = c.elapsedPct || 0;

  // Card tone — same mapping used on the regular CampaignPage so the BrandX
  // banner picks up its campaign's brand color (sky for E*TRADE).
  const cardTone =
    c.color === 'ft-ink' ? { bg: 'var(--liquorice)', fg: 'var(--cream)', track: 'rgba(245,241,232,0.2)', fill: 'var(--cream)' } :
    c.color === 'ft-1'   ? { bg: 'var(--orange)',  fg: 'var(--liquorice)', track: 'rgba(31,26,21,0.18)', fill: 'var(--liquorice)' } :
    c.color === 'ft-2'   ? { bg: 'var(--blossom)', fg: 'var(--liquorice)', track: 'rgba(31,26,21,0.18)', fill: 'var(--liquorice)' } :
    c.color === 'ft-3'   ? { bg: 'var(--sky)',     fg: 'var(--liquorice)', track: 'rgba(31,26,21,0.18)', fill: 'var(--liquorice)' } :
    c.color === 'ft-4'   ? { bg: 'var(--pear)',    fg: 'var(--liquorice)', track: 'rgba(31,26,21,0.18)', fill: 'var(--liquorice)' } :
    c.color === 'ft-5'   ? { bg: 'var(--lilac)',   fg: 'var(--liquorice)', track: 'rgba(31,26,21,0.18)', fill: 'var(--liquorice)' } :
    c.color === 'ft-6'   ? { bg: 'var(--flame)',   fg: 'var(--paper)',     track: 'rgba(250,247,239,0.2)', fill: 'var(--paper)' } :
                           { bg: 'var(--liquorice)', fg: 'var(--cream)', track: 'rgba(245,241,232,0.2)', fill: 'var(--cream)' };

  // Money / number formatters that handle None gracefully.
  // Money: 2 decimals under $100 (so per-click cost reads as $1.50 not $1.5),
  // no decimals at $100+ (so total spend reads as $4,789 not $4,789.00).
  const fmtNum = (n) => (n == null ? '—' : window.fmt.num(n));
  const fmtMoney = (n) => {
    if (n == null || isNaN(Number(n))) return '—';
    const num = Number(n);
    if (Math.abs(num) >= 100) return `$${Math.round(num).toLocaleString('en-US')}`;
    return `$${num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
  };
  const fmtPct = (n) => (n == null ? '—' : `${Number(n).toFixed(2)}%`);

  return (
    <>
      <PageHead
        overline={<>
          <span style={{cursor:'pointer'}} onClick={onBack}><Ic.back/> Overview</span>
          <span style={{margin:'0 8px', opacity:0.4}}>/</span>
          <span>{c.partner}</span>
          <span style={{margin:'0 8px', opacity:0.4}}>·</span>
          <span style={{
            background:'var(--liquorice)', color:'var(--paper)',
            padding:'2px 8px', borderRadius:4, fontSize:10, fontWeight:600,
            letterSpacing:'0.06em', textTransform:'uppercase'
          }}>BrandX</span>
          {c.brandxObjective && (
            <>
              <span style={{margin:'0 8px', opacity:0.4}}>·</span>
              <span style={{fontSize:10, fontFamily:'var(--mono)', color:'var(--ink-3)', letterSpacing:'0.06em', textTransform:'uppercase'}}>
                Primary: <strong style={{color:'var(--ink-2)'}}>{c.brandxObjective.replace('_',' ')}</strong>
                {c.brandxSecondaryObjective && (
                  <> · Secondary: <strong style={{color:'var(--ink-2)'}}>{c.brandxSecondaryObjective.replace('_',' ')}</strong></>
                )}
              </span>
            </>
          )}
        </>}
        title={c.series.replace(c.seriesItalic, '').trim()}
        italic={c.seriesItalic}
        actions={
          <div className="card" style={{
            padding:'14px 18px', minWidth:240, background:'var(--surface)',
            border:'1px solid var(--line)', borderRadius:'var(--r-md)',
            display:'flex', flexDirection:'column', gap:6
          }}>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, gap:16}}>
              <span style={{color:'var(--ink-3)', fontWeight:500}}>Partner</span>
              <span style={{color:'var(--ink)', fontWeight:600}}>{c.partner}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, gap:16}}>
              <span style={{color:'var(--ink-3)', fontWeight:500}}>Flight</span>
              <span style={{color:'var(--ink)', fontWeight:600}}>{c.flight}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, gap:16}}>
              <span style={{color:'var(--ink-3)', fontWeight:500}}>Posts</span>
              <span style={{color:'var(--ink)', fontWeight:600}}>{posts.length}</span>
            </div>
          </div>
        }
      />

      {/* HERO KPI TILES — three primary numbers, three secondary metrics
          shown as a tighter strip below. Layout is one card per row so all
          tiles share the same visual rhythm. */}
      <div className="sec">
        {(() => {
          // Pre-compute everything once so the markup stays clean
          const bx = window.BRANDX_BENCHMARKS || {};
          const obj = c.brandxObjective;
          const ctrBench = (obj && bx.ctrByObjective && bx.ctrByObjective[obj] != null)
            ? bx.ctrByObjective[obj]
            : bx.ctrOverall;
          const ctrDelta = ctrBench ? (blendedCTR - ctrBench) / ctrBench * 100 : null;
          const ctrGood = ctrDelta != null && ctrDelta >= 0;
          const totalReach = posts.reduce((s, p) => s + (p.reach || 0), 0);
          const frequency = totalReach > 0 ? totalImpr / totalReach : null;
          // Video Completion Rate = 100%-watched views / video views started.
          // "Started" = Meta's 3-second video view (paid `three_second_views`),
          // which is the industry-standard VCR denominator. Using impressions
          // would dilute the rate with static creative + scroll-pasts that
          // never started the video. Static IG posts contribute 0 in both
          // numerator AND denominator, so they correctly drop out of the mix.
          const totalP100 = posts.reduce((s, p) => s + (p.videoViews100Pct || 0), 0);
          const totalVideoStarts = posts.reduce((s, p) => s + (p.videoViews3s || 0), 0);
          const vcr = totalVideoStarts > 0 ? (totalP100 / totalVideoStarts * 100) : null;
          // Avg view duration = total watch time across all paid posts
          //   ÷ total video starts (3-sec views / paid plays).
          // FB Reels: watch time comes from MS directly (watch_time_minutes_paid).
          // IG ads: MS doesn't report watch time, so refresh.py estimates it
          // by integrating the p25/p50/p75/p95/p100 retention curve × video
          // duration. Approximate but close enough for blended messaging.
          const totalWatchMin = posts.reduce((s, p) => s + (p.watchTimeMin || 0), 0);
          const avgViewSec = totalVideoStarts > 0 ? (totalWatchMin * 60 / totalVideoStarts) : null;
          // Note: bx.vcrOverall is an impressions-based dark-posts benchmark
          // (~0.36%). Comparing it to a video-starts-based VCR is apples to
          // oranges, so we drop the delta and just surface the absolute rate
          // + total full-views count.
          const vcrBench = null;
          const vcrDelta = null;
          const vcrGood = false;

          // Shared tile styles — defined once so all six tiles match
          const tileBase = {padding:'22px 24px'};
          const tileLbl = {
            fontSize:10, color:'var(--ink-3)', letterSpacing:'0.1em',
            fontWeight:600, textTransform:'uppercase', marginBottom:10,
          };
          const tileNum = {
            fontFamily:'var(--serif)', fontSize:'clamp(28px, 2.6vw, 36px)',
            fontWeight:300, color:'var(--ink)', lineHeight:1,
            letterSpacing:'-0.02em', fontVariantNumeric:'tabular-nums',
          };
          const tileSub = {
            marginTop:10, fontSize:11, color:'var(--ink-3)',
            fontFamily:'var(--mono)', letterSpacing:'0.04em',
            minHeight:16,  // keep all tiles the same height
          };
          const progressBar = (pct, show) => show ? (
            <div style={{height:3, background:'var(--line)', borderRadius:2, marginTop:8, overflow:'hidden'}}>
              <div style={{height:'100%', width:`${Math.min(100, pct)}%`, background:'var(--accent)'}}/>
            </div>
          ) : <div style={{height:3, marginTop:8}}/>;

          return (
            <>
              {/* HERO PACING BANNER — mirrors the status banner on the regular
                  CampaignPage but expanded to three metric columns: impressions
                  (vs goal), spend (vs budget), and clicks (no goal, so the
                  subline shows CTR + CPC instead). Status pill sits in a
                  narrow leftmost column — no longer-form description, per the
                  team's preference for BrandX pages. */}
              <div style={{
                background: cardTone.bg, color: cardTone.fg,
                borderRadius: 'var(--r-lg)', padding: 22, marginBottom: 18,
                display: 'grid',
                gridTemplateColumns: '0.45fr 1fr 1fr 1fr', gap: 24,
                alignItems: 'center', position: 'relative', overflow: 'hidden'
              }}>
                <div>
                  <div style={{fontSize:10, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:600, opacity:0.7, marginBottom:10}}>Status</div>
                  <span style={{
                    display:'inline-flex', alignItems:'center', gap:6,
                    padding:'4px 12px', borderRadius:999,
                    background: 'rgba(255,255,255,0.92)',
                    color: c.statusKind === 'on' ? '#2f7a3f' : c.statusKind === 'danger' ? '#b8392b' : '#a06b14',
                    fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.06em', fontWeight:600
                  }}>
                    <span style={{
                      width:6, height:6, borderRadius:'50%',
                      background: c.statusKind === 'on' ? '#2f7a3f' : (c.statusKind === 'danger' ? '#b8392b' : '#a06b14')
                    }}/>
                    {c.status}
                  </span>
                  <div style={{fontSize:11, opacity:0.7, marginTop:10, fontFamily:'var(--mono)', letterSpacing:'0.04em'}}>
                    {c.daysLeft} days left · {elapsedPct.toFixed(0)}% time elapsed
                  </div>
                </div>

                <div>
                  <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', fontWeight:600, opacity:0.7, marginBottom:10}}>Impression delivery</div>
                  <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:8}}>
                    <span style={{fontFamily:'var(--serif)', fontSize:'clamp(34px, 3.4vw, 48px)', lineHeight:1, letterSpacing:'-0.02em', fontWeight:300}}>{window.fmt.num(totalImpr)}</span>
                    <span style={{fontSize:14, opacity:0.7}}>of {window.fmt.num(c.impressions.goal)}</span>
                  </div>
                  <div style={{height:6, background: cardTone.track, borderRadius:999, overflow:'hidden', marginBottom:6}}>
                    <div style={{height:'100%', width: Math.min(100, impPct) + '%', background: cardTone.fill, borderRadius:999}}/>
                  </div>
                  <div style={{fontSize:12, opacity:0.7}}>
                    {impPct.toFixed(1)}% delivered · {elapsedPct.toFixed(0)}% time elapsed
                  </div>
                </div>

                <div>
                  <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', fontWeight:600, opacity:0.7, marginBottom:10}}>Budget</div>
                  <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:8}}>
                    <span style={{fontFamily:'var(--serif)', fontSize:'clamp(34px, 3.4vw, 48px)', lineHeight:1, letterSpacing:'-0.02em', fontWeight:300}}>{fmtMoney(totalSpend)}</span>
                    <span style={{fontSize:14, opacity:0.7}}>of {fmtMoney(c.budget.goal)}</span>
                  </div>
                  <div style={{height:6, background: cardTone.track, borderRadius:999, overflow:'hidden', marginBottom:6}}>
                    <div style={{height:'100%', width: Math.min(100, budPct) + '%', background: cardTone.fill, borderRadius:999}}/>
                  </div>
                  <div style={{fontSize:12, opacity:0.7}}>
                    {budPct.toFixed(1)}% spent · {fmtMoney(Math.max(0, c.budget.goal - totalSpend))} remaining
                  </div>
                </div>

                <div>
                  <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', fontWeight:600, opacity:0.7, marginBottom:10}}>Total clicks</div>
                  <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:8}}>
                    <span style={{fontFamily:'var(--serif)', fontSize:'clamp(34px, 3.4vw, 48px)', lineHeight:1, letterSpacing:'-0.02em', fontWeight:300}}>{window.fmt.num(totalClicks)}</span>
                  </div>
                  {/* No goal for clicks — leave the bar slot empty so the
                      sublines on all three columns line up vertically. */}
                  <div style={{height:6, marginBottom:6}}/>
                  <div style={{fontSize:12, opacity:0.7}}>
                    {fmtPct(blendedCTR)} CTR · {fmtMoney(blendedCPC)} CPC
                  </div>
                </div>
              </div>

              {/* SECONDARY ROW — Blended CPC, Blended CTR, VCR, Avg View
                  Duration, Frequency. Five columns at smaller numeral size
                  than the banner above, so visual hierarchy reads top →
                  bottom. VCR = `video_views_p100` / 3-second video starts
                  across all paid posts (Meta-standard denominator — see
                  comment above the calc). */}
              <div style={{display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:14, marginBottom:14}}>
                <div className="card" style={tileBase}>
                  <div style={tileLbl}>Blended CPC</div>
                  <div style={{...tileNum, fontSize:'clamp(22px, 2vw, 28px)'}}>{fmtMoney(blendedCPC)}</div>
                  <div style={tileSub}>across all paid clicks</div>
                </div>

                <div className="card" style={tileBase}>
                  <div style={tileLbl}>Blended CTR</div>
                  <div style={{...tileNum, fontSize:'clamp(22px, 2vw, 28px)'}}>{fmtPct(blendedCTR)}</div>
                  <div style={{...tileSub,
                    color: ctrDelta == null ? 'var(--ink-3)'
                      : ctrGood ? 'var(--positive)' : 'var(--danger)'
                  }}>
                    {ctrDelta == null
                      ? 'no benchmark set'
                      : `${ctrDelta > 0 ? '+' : ''}${ctrDelta.toFixed(0)}% vs ${ctrBench.toFixed(2)}% bench`}
                  </div>
                </div>

                <div className="card" style={tileBase}>
                  <div style={tileLbl}>Video Completion</div>
                  <div style={{...tileNum, fontSize:'clamp(22px, 2vw, 28px)'}}>
                    {vcr != null ? fmtPct(vcr) : '—'}
                  </div>
                  <div style={tileSub}>
                    {vcr == null
                      ? 'no video starts yet'
                      : `${window.fmt.num(totalP100)} of ${window.fmt.num(totalVideoStarts)} starts`}
                  </div>
                </div>

                <div className="card" style={tileBase}>
                  <div style={tileLbl}>Avg View Duration</div>
                  <div style={{...tileNum, fontSize:'clamp(22px, 2vw, 28px)'}}>
                    {avgViewSec != null ? `${avgViewSec.toFixed(1)}s` : '—'}
                  </div>
                  <div style={tileSub}>
                    {avgViewSec != null
                      ? `${window.fmt.num(Math.round(totalWatchMin))} min watched`
                      : '—'}
                  </div>
                </div>

                <div className="card" style={tileBase}>
                  <div style={tileLbl}>Frequency</div>
                  <div style={{...tileNum, fontSize:'clamp(22px, 2vw, 28px)'}}>
                    {frequency != null ? `${frequency.toFixed(2)}×` : '—'}
                  </div>
                  <div style={tileSub}>
                    {frequency != null ? `avg views per reached user` : '—'}
                  </div>
                </div>
              </div>
            </>
          );
        })()}
      </div>

      {/* BY CHANNEL — paid efficiency per platform */}
      {channels.length > 0 && (
        <div className="sec">
          <div className="sec-h" style={{marginBottom:14}}>
            <div>
              <div className="sec-title">By <em>channel</em></div>
              <div className="sec-sub" style={{marginTop:4}}>
                Per-platform efficiency. CTR and CPC are the headline numbers for paid performance.
              </div>
            </div>
          </div>
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{
              display:'grid',
              gridTemplateColumns:'1.4fr 100px 90px 90px 130px 90px',
              gap:14, padding:'14px 22px',
              fontSize:10, fontFamily:'var(--mono)', color:'var(--ink-3)',
              letterSpacing:'0.1em', fontWeight:600, textTransform:'uppercase',
              borderBottom:'1px solid var(--line)', background:'var(--bg-soft)'
            }}>
              <div>Channel</div>
              <div style={{textAlign:'right'}}>Impr.</div>
              <div style={{textAlign:'right'}}>Spend</div>
              <div style={{textAlign:'right'}}>CPM</div>
              <div style={{textAlign:'right'}}>vs BrandX bench</div>
              <div style={{textAlign:'right'}}>ER</div>
            </div>
            {channels.map((ch, i) => {
              // Look up the BrandX per-platform CPM benchmark. Match by the
              // lowercased channel name with a couple of normalizations
              // (the channel name is "Facebook" / "Instagram"; benchmark
              // keys are lowercased).
              const bxBench = (window.BRANDX_BENCHMARKS || {}).cpmByPlatform || {};
              // Normalize "YouTube Shorts" → "youtubeShorts", "Facebook" →
              // "facebook" to match the camelCased benchmark keys.
              const lower = ch.name.toLowerCase();
              const snake = lower.replace(/\s+/g, '_');
              const camel = lower.replace(/\s+(.)/g, (_, c) => c.toUpperCase());
              const benchCpm = bxBench[camel] != null ? bxBench[camel] : bxBench[snake];
              const cpmDelta = (benchCpm && ch.cpm > 0) ? (ch.cpm - benchCpm) / benchCpm * 100 : null;
              const good = cpmDelta != null && cpmDelta <= 0;
              return (
              <div key={ch.name} style={{
                display:'grid',
                gridTemplateColumns:'1.4fr 100px 90px 90px 130px 90px',
                gap:14, padding:'14px 22px', alignItems:'center', fontSize:13,
                borderBottom: i < channels.length - 1 ? '1px solid var(--line)' : 'none'
              }}>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{width:8, height:8, borderRadius:'50%', background:ch.color}}/>
                  <span style={{fontWeight:500}}>{ch.name}</span>
                </div>
                <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{window.fmt.num(ch.impressions)}</div>
                <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmtMoney(((ch.cpm || 0) * ch.impressions / 1000).toFixed(0))}</div>
                <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{ch.cpm > 0 ? fmtMoney(ch.cpm.toFixed(2)) : '—'}</div>
                <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums', fontSize:11,
                  color: cpmDelta == null ? 'var(--ink-3)' : (good ? 'var(--positive)' : 'var(--danger)')}}>
                  {benchCpm == null
                    ? '—'
                    : cpmDelta == null
                      ? `$${benchCpm.toFixed(2)} bench`
                      : `${cpmDelta > 0 ? '+' : ''}${cpmDelta.toFixed(0)}% vs $${benchCpm.toFixed(2)}`}
                </div>
                <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmtPct(ch.er)}</div>
              </div>
              );
            })}
          </div>
        </div>
      )}

      {/* POST-LEVEL PERFORMANCE — every paid asset */}
      {posts.length > 0 && (
        <div className="sec">
          <div className="sec-h" style={{marginBottom:14}}>
            <div>
              <div className="sec-title">Post-level <em>performance</em></div>
              <div className="sec-sub" style={{marginTop:4}}>
                Every paid asset in the campaign. Sortable columns coming next pass — for now sorted by impressions descending.
              </div>
            </div>
          </div>
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{overflowX:'auto'}}>
              <div style={{minWidth: 1220}}>
                {/* Header. Watch min was dropped (only FB Reels populate it
                    natively; IG is estimated and the raw min count isn't
                    useful at the per-post grain). 100% Vw was replaced with
                    AVD — the per-post average view duration in seconds,
                    derived from watchTimeMin * 60 / videoViews3s. */}
                <div style={{
                  display:'grid',
                  gridTemplateColumns:'2fr 100px 70px 70px 70px 80px 70px 70px 70px 70px',
                  gap:10, padding:'12px 22px',
                  fontSize:10, fontFamily:'var(--mono)', color:'var(--ink-3)',
                  letterSpacing:'0.08em', fontWeight:600, textTransform:'uppercase',
                  borderBottom:'1px solid var(--line)', background:'var(--bg-soft)'
                }}>
                  <div>Post</div>
                  <div>Platform</div>
                  <div style={{textAlign:'right'}}>Impr.</div>
                  <div style={{textAlign:'right'}}>Views</div>
                  <div style={{textAlign:'right'}}>Reach</div>
                  <div style={{textAlign:'right'}}>Spend</div>
                  <div style={{textAlign:'right'}}>AVD</div>
                  <div style={{textAlign:'right'}}>Clicks</div>
                  <div style={{textAlign:'right'}}>CTR</div>
                  <div style={{textAlign:'right'}}>CPC / CPM</div>
                </div>
                {[...posts]
                  .sort((a, b) => (b.impr || 0) - (a.impr || 0))
                  .map((p, i, arr) => {
                    const title = p.title || '(no text)';
                    const clip = title.length > 95 ? title.slice(0, 95) + '…' : title;
                    const postAvd = (p.watchTimeMin && p.videoViews3s)
                      ? (p.watchTimeMin * 60 / p.videoViews3s)
                      : null;
                    return (
                      <a key={i}
                         href={p.url || '#'}
                         target={p.url ? '_blank' : undefined}
                         rel={p.url ? 'noopener noreferrer' : undefined}
                         style={{
                           display:'grid',
                           gridTemplateColumns:'2fr 100px 70px 70px 70px 80px 70px 70px 70px 70px',
                           gap:10, padding:'14px 22px', alignItems:'center', fontSize:12,
                           textDecoration:'none', color:'inherit',
                           borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 'none',
                           cursor: p.url ? 'pointer' : 'default'
                         }}>
                        <div style={{minWidth:0, overflow:'hidden', textOverflow:'ellipsis'}}>{clip}</div>
                        <div><PlatformPill name={p.platform}/></div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmtNum(p.impr)}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmtNum(p.views)}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmtNum(p.reach)}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmtMoney(p.spend && p.spend.toFixed(2))}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{postAvd != null ? `${postAvd.toFixed(1)}s` : '—'}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmtNum(p.clicks)}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{p.ctr != null ? fmtPct(p.ctr) : '—'}</div>
                        <div style={{textAlign:'right', fontVariantNumeric:'tabular-nums', fontSize:11, color:'var(--ink-2)'}}>
                          {p.cpc != null ? `${fmtMoney(p.cpc.toFixed(2))}` : '—'}
                          <span style={{color:'var(--ink-3)'}}> · </span>
                          {p.cpm != null ? `${fmtMoney(p.cpm.toFixed(2))}` : '—'}
                        </div>
                      </a>
                    );
                  })}
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

window.CampaignPage = CampaignPage;

</script>
<script type="text/babel">
/* global React, CAMPAIGNS, fmt, Ic, PlatformPill, PageHead */
const { useState: useStateUB } = React;

// ============================================================
// US BANK x NFL DRAFT — bespoke layout
// 3 social components, no episodes/cutdowns
// ============================================================

const UB_COMPONENTS = window.UB_COMPONENTS || [];

const PLATFORM_CPMS = window.UB_PLATFORM_CPMS || [];

// ── Distribution badge ─────────────────────────────────────
function DistBadge({ kind }) {

    'organic+paid': { bg:'rgba(80,135,230,0.16)', fg:'#3450a8', label:'ORGANIC + PAID' },

  const s = styles[kind] || styles.organic;
  return (
    <span style={{
      background: s.bg, color: s.fg, padding:'2px 8px', borderRadius:999,
      fontSize:9, fontFamily:'var(--mono)', fontWeight:600, letterSpacing:'0.06em', whiteSpace:'nowrap'

}

// ── Component summary card (top-of-page) ─────────────────────
function ComponentCard({ comp, onClick, active }) {

          <div style={{fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, opacity:0.7, marginBottom:4}}>Impressions</div>

}

// ── Pacing pill ─────────────────────────────────────────────
function PaceBarUB({ pct, color, track }) {
  return (
    <div style={{height:8, background: track || 'rgba(31,26,21,0.12)', borderRadius:999, overflow:'hidden', position:'relative'}}>
      <div style={{height:'100%', width: Math.min(100,pct)+'%', background: color, borderRadius:999}}/>

        <div style={{position:'absolute', top:0, right:0, height:'100%', width:'4px', background:'var(--liquorice)'}}/>
      )}
    </div>
  );
}

// ── Master pacing — stacked bar ─────────────────────────────
function MasterPacing() {
  const total = UB_COMPONENTS.reduce((s,c) => s + c.impressions.delivered, 0);
  const goal = UB_COMPONENTS.reduce((s,c) => s + c.impressions.goal, 0);
  const spent = UB_COMPONENTS.reduce((s,c) => s + c.budget.delivered, 0);
  const budget = UB_COMPONENTS.reduce((s,c) => s + c.budget.goal, 0);
  const overall = (total / goal) * 100;
  const overallBud = (spent / budget) * 100;

  return (
    <div className="card" style={{marginBottom:24, padding:28}}>
      <div className="card-h" style={{marginBottom:18}}>
        <div>
          <div className="card-title-serif">Total <em>campaign pacing</em></div>
          <div className="card-sub">Combined progress across all 3 social components toward 14M impression goal.</div>
        </div>
        <span className="pill" style={{
          background:'rgba(143,199,102,0.18)', color:'#2f7a3f', border:'none', fontWeight:600
        }}>
          <span className="dot" style={{background:'#2f7a3f'}}/>Goal Exceeded
        </span>
      </div>

      {/* Stacked bar */}
      <div style={{position:'relative', marginBottom:10}}>
        <div style={{height:36, background:'var(--bg-soft)', borderRadius:8, overflow:'hidden', display:'flex'}}>
          {UB_COMPONENTS.map(c => {
            const pct = (c.impressions.delivered / goal) * 100;
            return (
              <div key={c.id} style={{width: pct+'%', background: c.color, height:'100%', position:'relative'}}>
                {pct > 8 && (
                  <div style={{
                    position:'absolute', inset:0, display:'flex', alignItems:'center', padding:'0 12px',
                    color: c.fg, fontSize: 11, fontWeight:600, fontFamily:'var(--mono)', letterSpacing:'0.05em'
                  }}>{fmt.num(c.impressions.delivered)}</div>
                )}
              </div>
            );
          })}
        </div>
        {/* Goal marker */}
        <div style={{position:'absolute', top:-6, bottom:-6, left:'100%', width:2, background:'var(--ink)', opacity:0.7}}>
          <span style={{position:'absolute', top:-18, right:0, fontSize:10, fontFamily:'var(--mono)', fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap'}}>14M GOAL</span>
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', fontSize:12, color:'var(--ink-2)', marginBottom:18}}>
        <span><strong style={{color:'var(--ink)'}}>{fmt.num(total)}</strong> of {fmt.num(goal)} impressions
          (<strong style={{color:'#2f7a3f'}}>{overall.toFixed(1)}% — Goal Exceeded</strong>)</span>
        <span style={{color:'var(--ink-3)'}}>{fmt.money(spent)} of {fmt.money(budget)} spent · {overallBud.toFixed(1)}%</span>
      </div>

      {/* Legend */}
      <div style={{display:'flex', gap:20, flexWrap:'wrap', fontSize:12, paddingTop:16, borderTop:'1px solid var(--line)'}}>
        {UB_COMPONENTS.map(c => (
          <div key={c.id} style={{display:'flex', alignItems:'center', gap:8}}>
            <div style={{width:12, height:12, borderRadius:3, background:c.color}}/>
            <span><strong style={{color:'var(--ink)'}}>Component {c.n}:</strong> {c.title} — {fmt.num(c.impressions.delivered)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Platform performance table ──────────────────────────────
function PlatformTable({ comp }) {
  const totals = comp.platforms.reduce((acc, p) => ({
    posts: acc.posts + p.posts,
    organic: acc.organic + (p.organic || 0),
    paid: acc.paid + (p.paid || 0),

    eng: acc.eng + p.eng,
    spend: acc.spend + p.spend,
    est: acc.est + (p.est || 0)
  }), { posts:0, organic:0, paid:0, total:0, eng:0, spend:0, est:0 });
  const totalEr = (totals.eng / totals.total) * 100;
  const totalPct = totals.est > 0 ? (totals.spend / totals.est) * 100 : null;

  return (
    <div style={{overflowX:'auto', border:'1px solid var(--line)', borderRadius:'var(--r-lg)', background:'var(--surface)'}}>

          <tr style={{background:'var(--bg-soft)', borderBottom:'1px solid var(--line)'}}>

              <th key={h} style={{
                padding:'12px 14px', textAlign: i === 0 ? 'left' : 'right',

              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color:'var(--ink-2)'}}>{p.paid === null ? '—' : fmt.num(p.paid)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmt.num(p.total)}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(p.eng)}</td>

              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{p.spend === 0 ? '—' : '$'+fmt.num(Math.round(p.spend))}</td>
              <td style={{padding:'12px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color:'var(--ink-3)'}}>{!p.est ? '—' : '$'+fmt.num(p.est)}</td>

            </tr>

          <tr style={{background:'var(--liquorice)', color:'var(--cream)'}}>
            <td style={{padding:'14px', fontWeight:600, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase'}}>Total</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{totals.posts}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(totals.organic)}</td>

            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{fmt.num(totals.total)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(totals.eng)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>{totalEr.toFixed(1)}%</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600}}>${fmt.num(Math.round(totals.spend))}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{totals.est === 0 ? '—' : '$'+fmt.num(totals.est)}</td>
            <td style={{padding:'14px', textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:600, color: totalPct && totalPct > 110 ? '#ffcccb' : 'var(--cream)'}}>{totalPct === null ? '—' : totalPct.toFixed(1)+'%'}</td>

        </tbody>
      </table>

              <td style={{padding:'10px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt.num(r.eng)}</td>
              <td style={{padding:'10px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums', color: r.er >= 5 ? '#2f7a3f' : 'var(--ink-2)', fontWeight: r.er >= 5 ? 600 : 400}}>{r.er.toFixed(r.er < 1 ? 2 : 1)}%</td>
              <td style={{padding:'10px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{r.spend === 0 ? '—' : '$'+fmt.num(Math.round(r.spend))}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── Callout block (Win / Watch / Opportunity) ──────────────
function Callout({ co }) {
  const tone = co.kind === 'pos' ? { bar: 'var(--pear)', tag: '#2f7a3f', bg:'rgba(143,199,102,0.12)' } :
    co.kind === 'warn' ? { bar: 'var(--orange)', tag: '#b8392b', bg:'rgba(255,153,71,0.14)' } :
    { bar: 'var(--sky)', tag: 'var(--ink)', bg:'rgba(80,135,230,0.08)' };
  return (
    <div style={{
      background:'var(--surface)', border:'1px solid var(--line)', borderRadius:'var(--r-lg)',
      padding: 22, position:'relative', overflow:'hidden',
      display:'flex', flexDirection:'column', gap:10
    }}>
      <div style={{position:'absolute', left:0, top:0, bottom:0, width:4, background: tone.bar}}/>
      <span style={{
        fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.14em',
        fontWeight:600, color: tone.tag, alignSelf:'flex-start',
        padding:'3px 8px', background: tone.bg, borderRadius: 4
      }}>{co.tag}</span>
      <div style={{fontFamily:'var(--serif)', fontSize:20, fontWeight:300, lineHeight:1.25, letterSpacing:'-0.01em', color:'var(--ink)'}}>{co.headline}</div>
      <div style={{fontSize:13, lineHeight:1.55, color:'var(--ink-2)'}}>{co.body}</div>
    </div>
  );
}

// ── Component section (full detail per component) ─────────
function ComponentSection({ comp }) {
  const impPct = (comp.impressions.delivered / comp.impressions.goal) * 100;
  const budPct = comp.budget.goal > 0 ? (comp.budget.delivered / comp.budget.goal) * 100 : 0;
  const accentColor = comp.color;

  return (
    <div id={`comp-${comp.id}`} className="sec" style={{scrollMarginTop:24}}>
      <div className="sec-h">
        <div>
          <div style={{fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:8, textTransform:'uppercase'}}>
            Social Component {comp.n}
          </div>
          <div className="sec-title">{comp.title.replace(comp.italic, '').trim()} <em>{comp.italic}</em></div>
          <div className="sec-sub" style={{marginTop:6}}>{comp.sub} · Goal: {fmt.num(comp.impressions.goal)} impr · Budget: {fmt.money(comp.budget.goal)}</div>
        </div>
        <span className="pill" style={{
          background: comp.statusKind === 'on' ? 'rgba(143,199,102,0.18)' : 'rgba(255,153,71,0.18)',
          color: comp.statusKind === 'on' ? '#2f7a3f' : '#b8392b',
          border:'none', fontWeight:600
        }}>
          <span className="dot" style={{background: comp.statusKind === 'on' ? '#2f7a3f' : '#b8392b'}}/>
          {comp.status}{comp.statusKind === 'watch' ? ` — ${impPct.toFixed(1)}%` : ''}
        </span>
      </div>

      {/* Pacing strip — 2 bars */}
      <div className="card" style={{marginBottom:18, padding:22}}>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24}}>
          <div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
              <span style={{fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-3)'}}>Impressions</span>
              <span style={{fontSize:12, color:'var(--ink-2)'}}>
                <strong style={{color:'var(--ink)'}}>{fmt.num(comp.impressions.delivered)}</strong> of {fmt.num(comp.impressions.goal)}
                <span style={{marginLeft:8, color: impPct >= 100 ? '#2f7a3f' : '#a06b14', fontWeight:600}}>{impPct.toFixed(1)}%</span>
              </span>
            </div>
            <PaceBarUB pct={impPct} color={accentColor}/>
          </div>
          <div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
              <span style={{fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-3)'}}>Spend</span>
              <span style={{fontSize:12, color:'var(--ink-2)'}}>
                <strong style={{color:'var(--ink)'}}>{fmt.money(comp.budget.delivered)}</strong> of {fmt.money(comp.budget.goal)}
                <span style={{marginLeft:8, color: budPct > 110 ? '#b8392b' : budPct < 50 ? '#a06b14' : 'var(--ink-2)', fontWeight:600}}>{budPct.toFixed(1)}%</span>
              </span>
            </div>
            <PaceBarUB pct={budPct} color={budPct > 110 ? 'var(--flame)' : 'var(--liquorice)'}/>
          </div>
        </div>
        {comp.budgetNote && (
          <div style={{
            marginTop:14, padding:'10px 14px',
            background:'rgba(255,206,0,0.14)', border:'1px solid rgba(255,206,0,0.3)',
            borderRadius:8, fontSize:12, color:'var(--ink-2)', lineHeight:1.5
          }}>
            <strong style={{color:'var(--ink)'}}>Budget note: </strong>{comp.budgetNote}
          </div>
        )}
      </div>

      {/* KPIs */}
      <div className="kpi-row" style={{gridTemplateColumns:'repeat(5, 1fr)'}}>
        <div className="kpi"><div className="kpi-lbl">Posts Live</div><div className="kpi-val">{comp.posts}</div><div className="kpi-foot"><span className="muted">{comp.sub.split('·')[0].trim().toLowerCase()}</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Impressions</div><div className="kpi-val">{fmt.num(comp.impressions.delivered)}</div><div className="kpi-foot"><span className="muted">{impPct.toFixed(1)}% of goal</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Engagements</div><div className="kpi-val">{fmt.num(comp.engagements)}</div><div className="kpi-foot"><span className="muted">cross-platform</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Eng. Rate</div><div className="kpi-val">{comp.er}<span className="unit">%</span></div><div className="kpi-foot"><span className="muted">blended</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Spend</div><div className="kpi-val">{fmt.money(comp.budget.delivered)}</div><div className="kpi-foot"><span className="muted">of {fmt.money(comp.budget.goal)} ({budPct.toFixed(0)}%)</span></div></div>
      </div>

      {/* Platform performance table */}
      {comp.platforms && (
        <div style={{marginTop:24, marginBottom:18}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Platform <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>
            Engagements = MS social engagements + Google Ads YT Shorts engagements combined. Paid impressions sourced from Meta Ads Manager (IG/FB), X Ads Manager, and Google Ads (YT Shorts). Organic from Measure Studio.
          </div>
          <PlatformTable comp={comp}/>
        </div>
      )}

      {/* Stories (Come Up) or Videos (Red Carpet) */}
      {comp.stories && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Story <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14}}>4 stories × 5 platforms = 20 posts. Click any row to see the platform breakdown.</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {comp.stories.map(s => <StoryCard key={s.name} story={s} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {comp.videos && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Per-video <em>detail</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>2 videos across 5 platforms. Video 1 is organic boosted with paid amplification. Video 2 is paid-only (dark) — no organic delivery anywhere.</div>
          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            {comp.videos.map(v => <VideoCard key={v.name} video={v} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {/* Callouts */}
      <div style={{marginTop:24}}>
        <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:14}}>What we're <em>seeing</em></div>
        <div style={{display:'grid', gridTemplateColumns: comp.callouts.length === 1 ? '1fr' : `repeat(${comp.callouts.length}, 1fr)`, gap:14}}>
          {comp.callouts.map((co, i) => <Callout key={i} co={co}/>)}
        </div>
      </div>
    </div>
  );
}

// ── Main page ───────────────────────────────────────────────
function UsBankPage({ campaignId, onBack }) {
  const c = CAMPAIGNS.find(x => x.id === 'usbank');
  const [activeComp, setActiveComp] = useStateUB(null);

  const scrollTo = (id) => {
    const el = document.getElementById(`comp-${id}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    setActiveComp(id);
  };

  return (
    <>
      <PageHead
        overline={onBack ? (
          <>
            <span style={{cursor:'pointer'}} onClick={onBack}><Ic.back/> Overview</span>
            <span style={{margin:'0 8px', opacity:0.4}}>/</span>
            <span>{c.partner}</span>
          </>

          // Standalone US Bank document — no Overview to navigate back to.

            fontSize:11, letterSpacing:'0.16em', textTransform:'uppercase',

        title="NFL"
        italic="Draft"
        sub={<>Partner: <strong>US Bank</strong> · Flight: {c.flight} · 3 social components · <strong>38 posts live</strong> across IG, FB, X, LinkedIn, YouTube Shorts</>}

      />

      {/* Hero — 3-component overview */}
      <div style={{marginBottom:24}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14}}>
          <div>
            <div style={{fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:6, textTransform:'uppercase'}}>
              Three Social Components
            </div>
            <div style={{fontFamily:'var(--serif)', fontSize:28, fontWeight:300, letterSpacing:'-0.01em'}}>
              Each tracked <em>independently.</em>
            </div>
          </div>
          <div style={{fontSize:12, color:'var(--ink-3)', maxWidth:380, textAlign:'right', lineHeight:1.5}}>
            Click a component to jump to its full breakdown. Each has its own goal, budget, and post inventory.
          </div>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14}}>
          {UB_COMPONENTS.map(comp => (
            <ComponentCard key={comp.id} comp={comp} active={activeComp === comp.id} onClick={() => scrollTo(comp.id)}/>

      {/* Master pacing — stacked */}

      {/* Component sections */}
      {UB_COMPONENTS.map((comp, idx) => (
        <React.Fragment key={comp.id}>
          {idx > 0 && <div style={{height:1, background:'var(--line)', margin:'32px 0'}}/>}

      {/* Data sources footer */}
      <div className="sec" style={{marginTop:32}}>
        <div className="card" style={{padding:22, background:'var(--bg-soft)'}}>
          <div style={{fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:8, textTransform:'uppercase'}}>Data Sources</div>
          <div style={{fontSize:12, color:'var(--ink-2)', lineHeight:1.6}}>
            Social metrics from Measure Studio export (April 27, 2026) — 20 Come Up posts, 10 Native Social Coverage posts, 6 Red Carpet posts (+ 2 dark posts via Ads Managers).
            Paid data from Meta Ads Manager (IG/FB), X Ads Manager, Google Ads (YT Shorts). Organic from Measure Studio.
            Total spend: <strong style={{color:'var(--ink)'}}>$30,986 of $31,375 (98.8%)</strong>.
            Total delivery: <strong style={{color:'var(--ink)'}}>14.51M of 14.0M (103.6% — Goal Exceeded)</strong>.
          </div>
        </div>
      </div>
    </>
  );
}

window.UsBankPage = UsBankPage;

</script>
<script type="text/babel">
/* global React, BENCHMARKS_DATA, PageHead */
const { useState: useStateB } = React;

// ============================================================
// BENCHMARKS PAGE
// FOS social ER benchmarks across content categories.
// Source: config/social_benchmarks.csv
// ============================================================

function BenchmarksPage() {
  const data = window.BENCHMARKS_DATA || {};
  const categories = data.categories || [];
  const platformSummary = data.platformSummary || data.platform_summary || [];
  const lastUpdated = data.lastUpdated || data.last_updated || '—';
  const [openIdx, setOpenIdx] = useStateB(0);

  return (
    <>
      <PageHead
        overline={`FOS Internal · Last updated ${lastUpdated}`}
        title="Benchmarks"
        italic="by category."
        sub={<>Engagement rate benchmarks across content types, drawn from completed FOS campaigns. <strong>Sponsored-only</strong> is the true benchmark for current work; <strong>all-content</strong> shown as a broader reference.</>}
      />

      {/* PLATFORM SUMMARY */}
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">Platform <em>benchmarks (2025)</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Aggregate ER% across all FOS social activity.</div>
          </div>
        </div>
        <PlatformSummaryTable rows={platformSummary}/>
      </div>

      {/* CATEGORY NAV CHIPS */}
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">By <em>category</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Click a category to jump to its detail.</div>
          </div>
        </div>
        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:24}}>
          {categories.map((cat, i) => (
            <button
              key={i}
              onClick={() => { setOpenIdx(i); document.getElementById(`cat-${i}`)?.scrollIntoView({behavior:'smooth', block:'start'}); }}
              style={{
                fontFamily:'inherit', fontSize:12, fontWeight:500,
                padding:'7px 14px', borderRadius:999,
                background: i === openIdx ? 'var(--liquorice)' : 'var(--surface)',
                color: i === openIdx ? 'var(--cream)' : 'var(--ink)',
                border:`1px solid ${i === openIdx ? 'var(--liquorice)' : 'var(--line)'}`,
                cursor:'pointer'
              }}
            >
              {shortCategoryName(cat.name)}
            </button>
          ))}
        </div>
      </div>

      {/* CATEGORY SECTIONS */}
      {categories.map((cat, i) => (
        <CategorySection key={i} cat={cat} idx={i}/>
      ))}
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Platform summary — top 3-row table
// ──────────────────────────────────────────────────────────
function PlatformSummaryTable({ rows }) {
  if (!rows.length) return null;
  // Get unique platforms across all rows, preserving canonical order
  const order = ['Instagram', 'Facebook', 'X', 'TikTok', 'LinkedIn', 'YouTube'];
  const platforms = order.filter(p => rows.some(r => r.platforms && r.platforms[p] !== undefined));

  return (
    <div className="card" style={{padding:0, overflow:'hidden'}}>
      <table className="tbl" style={{width:'100%', fontSize:13}}>
        <thead>
          <tr>
            <th style={{textAlign:'left'}}>Row</th>
            {platforms.map(p => <th key={p} className="num" style={{textAlign:'right'}}>{p}</th>)}
            <th className="num" style={{textAlign:'right', borderLeft:'1px solid var(--line)'}}>All (AVG)</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => {
            const isPrimary = row.row.toLowerCase().includes('all content in this doc') || row.row.toLowerCase().includes('all content');
            return (
              <tr key={i} style={{background: i === rows.length - 1 ? 'rgba(222,107,56,0.06)' : undefined}}>
                <td style={{fontWeight: i === rows.length - 1 ? 600 : 500, fontSize: 13}}>
                  {row.row}
                  {i === rows.length - 1 && <span style={{marginLeft:8, fontSize:9, fontFamily:'var(--mono)', letterSpacing:'0.1em', color:'var(--flame)', fontWeight:700}}>FOS</span>}
                </td>
                {platforms.map(p => (
                  <td key={p} className="num">
                    {row.platforms && row.platforms[p] !== undefined ? `${row.platforms[p].toFixed(2)}%` : '—'}
                  </td>
                ))}
                <td className="num" style={{fontWeight:600, borderLeft:'1px solid var(--line)'}}>
                  {(() => {
                    const v = row.allAvg !== undefined ? row.allAvg : row.all_avg;
                    return v !== null && v !== undefined ? `${v.toFixed(2)}%` : '—';
                  })()}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Category section — overall ER + per-campaign table
// ──────────────────────────────────────────────────────────
function CategorySection({ cat, idx }) {
  const overall = cat.overall || {};
  // Get the platform columns that appear in the campaigns / overall
  const PLATFORM_ORDER = ['YouTube', 'Instagram', 'Facebook', 'X', 'TikTok', 'LinkedIn', 'Shorts'];
  const platforms = PLATFORM_ORDER.filter(p =>
    overall[p] !== undefined || (cat.campaigns || []).some(c => c.platforms && c.platforms[p] !== undefined)
  );

  return (
    <div id={`cat-${idx}`} className="sec" style={{marginBottom:36, scrollMarginTop:24}}>
      <div className="sec-h" style={{borderBottom:'1px solid var(--line)', paddingBottom:14}}>
        <div>
          <div style={{fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:6, textTransform:'uppercase'}}>
            Category {String(idx + 1).padStart(2, '0')}
          </div>
          <div className="sec-title">{cat.name}</div>
        </div>
        {overall.All !== null && overall.All !== undefined && (
          <span style={{
            display:'inline-flex', alignItems:'center', gap:6,
            padding:'5px 12px', borderRadius:999,
            background:'var(--bg-soft)', border:'1px solid var(--line)',
            fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.06em', fontWeight:600, color:'var(--ink-2)'
          }}>
            CATEGORY AVG <strong style={{color:'var(--ink)', marginLeft:4}}>{overall.All.toFixed(2)}%</strong>
          </span>
        )}
      </div>

      {/* Overall ER per platform — category benchmark row */}
      <div style={{marginTop:18, marginBottom:18}}>
        <div style={{fontSize:10, fontFamily:'var(--mono)', letterSpacing:'0.12em', fontWeight:600, color:'var(--ink-3)', marginBottom:10, textTransform:'uppercase'}}>
          Category benchmark · ER by platform
        </div>
        <div className="card" style={{padding:0, overflow:'hidden'}}>
          <div style={{display:'grid', gridTemplateColumns:`repeat(${platforms.length}, minmax(0, 1fr))`, borderTop:'none'}}>
            {platforms.map((p, i) => (
              <div key={p} style={{
                padding:'14px 12px',
                borderRight: i < platforms.length - 1 ? '1px solid var(--line)' : 'none',
                display:'flex', flexDirection:'column', gap:4
              }}>
                <span style={{fontSize:10, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.1em', fontWeight:600}}>{p}</span>
                <span style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, color:'var(--ink)', letterSpacing:'-0.02em'}}>
                  {overall[p] !== null && overall[p] !== undefined ? `${overall[p].toFixed(2)}%` : '—'}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Per-campaign breakdown */}
      {(cat.campaigns || []).length > 0 && (
        <div>
          <div style={{fontSize:10, fontFamily:'var(--mono)', letterSpacing:'0.12em', fontWeight:600, color:'var(--ink-3)', marginBottom:10, textTransform:'uppercase'}}>
            By campaign — green ▲ above category bench · red ▼ below
          </div>
          <div className="card" style={{padding:0, overflow:'auto'}}>
            <table className="tbl" style={{width:'100%', fontSize:13}}>
              <thead>
                <tr>
                  <th style={{textAlign:'left'}}>Campaign</th>
                  {platforms.map(p => <th key={p} className="num" style={{textAlign:'right'}}>{p}</th>)}
                  <th className="num" style={{textAlign:'right', borderLeft:'1px solid var(--line)'}}>All</th>
                  <th className="num" style={{textAlign:'right'}}>Spend</th>
                </tr>
              </thead>
              <tbody>
                {cat.campaigns.map((camp, i) => (
                  <tr key={i}>
                    <td style={{fontWeight:500, maxWidth:280, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{camp.name}</td>
                    {platforms.map(p => {
                      const v = camp.platforms && camp.platforms[p];
                      const bench = overall[p];
                      const color = (v != null && bench != null)
                        ? (v > bench ? 'var(--positive)' : v < bench ? 'var(--danger)' : 'var(--ink-2)')
                        : 'var(--ink-3)';
                      const weight = (v != null && bench != null && (v > bench || v < bench)) ? 600 : 400;
                      return (
                        <td key={p} className="num" style={{color, fontWeight:weight}}>
                          {v != null ? `${v.toFixed(2)}%` : '—'}
                        </td>
                      );
                    })}
                    <td className="num" style={{fontWeight:600, borderLeft:'1px solid var(--line)'}}>
                      {camp.all != null ? `${camp.all.toFixed(2)}%` : '—'}
                    </td>
                    <td className="num" style={{fontVariantNumeric:'tabular-nums', color:'var(--ink-3)'}}>
                      {camp.spend || '—'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function shortCategoryName(name) {
  if (!name) return '';
  // Strip trailing "(parenthetical detail)" for chips
  return name.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

window.BenchmarksPage = BenchmarksPage;

</script>
<script type="text/babel">
/* global React, CAMPAIGNS, BENCHMARKS_DATA, fmt, Ic, PageHead */
// ============================================================
// INPUTS PAGE
// Two modes:
//   • New campaign  — capture client/series/format/flight/goals/budget/episodes,
//                     plus a drop-zone for the initial export files.
//   • Ongoing campaign — per-campaign upload boxes + a notes textarea.
//
// This is a static dashboard, so "uploads" here are captured client-side
// (file names + sizes + chosen target campaign) and surfaced in a "queue"
// the operator copies into tests/fixtures/ alongside the YAML edits.
// Form drafts persist in localStorage so a half-finished entry isn't lost
// on refresh.
// ============================================================

function InputsPage() {
  const [tab, setTab] = React.useState('new'); // 'new' | 'ongoing'

  return (
    <>
      <PageHead
        overline={`Sponsored campaigns · ${new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' })}`}

// ============================================================
// SUBMIT QUEUE ROW — posts queued files to /.netlify/functions/upload-csv
// ============================================================
// Authentication: shared team password, prompted once per session and
// cached in sessionStorage so the team doesn't have to re-enter it for
// every campaign card upload.
const PASSWORD_KEY = 'inputs.upload.password';

function getUploadPassword() {
  let p = sessionStorage.getItem(PASSWORD_KEY);
  if (!p) {
    p = window.prompt('Team upload password:') || '';
    if (p) sessionStorage.setItem(PASSWORD_KEY, p);
  }
  return p;
}

function clearUploadPassword() {
  sessionStorage.removeItem(PASSWORD_KEY);
}

function SubmitQueueRow({ campaignId, queue, onClear }) {
  const [status, setStatus] = React.useState({ kind: 'idle' });
  // Don't render the row at all when there's nothing queued — avoids visual
  // noise on the dozen-plus campaign cards on the page.
  if (queue.length === 0) return null;

  const submit = async () => {
    const password = getUploadPassword();
    if (!password) {
      setStatus({ kind: 'error', message: 'Password required.' });
      return;
    }
    setStatus({ kind: 'uploading', done: 0, total: queue.length });

    const results = [];
    for (let i = 0; i < queue.length; i++) {
      const file = queue[i];
      if (!file.content_base64) {
        results.push({ name: file.name, ok: false, error: 'Missing file content (re-add the file).' });
        setStatus({ kind: 'uploading', done: i + 1, total: queue.length });
        continue;
      }
      // Filename naming convention: <campaign_id>_<source_kind>.csv unless
      // the user has named the file something specific. The backend
      // sanitizes again, but applying it here gives them a meaningful name
      // in the success message.
      const kind = SOURCE_KIND_FOR[file.target] || 'other';
      const filename = file.name.toLowerCase().startsWith(campaignId.toLowerCase())
        ? file.name
        : `${campaignId}_${kind}.csv`;

      try {
        const res = await fetch('/.netlify/functions/upload-csv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password,
            campaign_id: campaignId,
            filename,
            content_base64: file.content_base64,
          }),
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 401) clearUploadPassword();
          results.push({ name: file.name, ok: false, error: j.error || `HTTP ${res.status}` });
        } else {
          results.push({ name: file.name, ok: true });
        }
      } catch (e) {
        results.push({ name: file.name, ok: false, error: String(e?.message || e) });
      }
      setStatus({ kind: 'uploading', done: i + 1, total: queue.length });
    }

    const failed = results.filter(r => !r.ok);
    if (failed.length === 0) {
      setStatus({ kind: 'success', uploaded: results.length });
      onClear();
    } else {
      setStatus({ kind: 'partial', results });
    }
  };

  return (
    <div style={{
      padding: '14px 20px',
      borderTop: '1px solid var(--line)',
      background: 'var(--bg-soft)',
      display: 'flex',
      justifyContent: 'space-between',
      alignItems: 'center',
      gap: 14,
    }}>
      <div style={{fontSize: 11, color: 'var(--ink-3)', fontFamily: 'var(--mono)', letterSpacing: '0.04em'}}>
        {status.kind === 'uploading'
          ? `Uploading ${status.done}/${status.total}…`
          : status.kind === 'success'
            ? `✓ ${status.uploaded} file${status.uploaded === 1 ? '' : 's'} uploaded — dashboard refresh in ~2 min`
            : status.kind === 'partial'
              ? `⚠ Some uploads failed — see below`
              : `${queue.length} file${queue.length === 1 ? '' : 's'} ready to submit`}
      </div>
      <button
        onClick={submit}
        disabled={status.kind === 'uploading'}
        style={{
          background: status.kind === 'uploading' ? 'var(--ink-3)' : 'var(--liquorice)',
          color: 'var(--cream)',
          border: 'none', borderRadius: 6,
          padding: '8px 18px', fontSize: 12, fontWeight: 600,
          fontFamily: 'inherit', letterSpacing: '0.04em',
          cursor: status.kind === 'uploading' ? 'wait' : 'pointer',
        }}>
        {status.kind === 'uploading' ? 'Uploading…' : 'Submit & refresh'}
      </button>
      {/* Inline error detail when one or more files failed. Kept compact so
          the per-campaign card doesn't blow up vertically. */}
      {status.kind === 'partial' && (
        <div style={{flexBasis: '100%', marginTop: 8, fontSize: 11, color: 'var(--danger, #b8392b)'}}>
          {status.results.filter(r => !r.ok).map((r, i) => (
            <div key={i}>• {r.name}: {r.error}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// ============================================================
// Shared form primitives
// ============================================================
const fieldStyle = { display:'flex', flexDirection:'column', gap:6 };
const labelStyle = { fontSize:10, fontFamily:'var(--mono)', letterSpacing:'0.1em', color:'var(--ink-3)', fontWeight:600, textTransform:'uppercase' };
const hintStyle  = { fontSize:11, color:'var(--ink-3)', marginTop:-2, lineHeight:1.35 };
const inputStyle = {
  background:'var(--bg)', border:'1px solid var(--line)', borderRadius:6,
  padding:'9px 12px', fontSize:13, fontFamily:'inherit', color:'var(--ink)',
  outline:'none', transition:'border 0.15s',
};
const btnGhost = {
  background:'transparent', border:'1px solid var(--line)', borderRadius:6,
  padding:'9px 16px', fontSize:13, fontFamily:'inherit', cursor:'pointer',
  color:'var(--ink-2)',
};

function Field({ label, required, hint, full, children }) {
  return (
    <div style={{ ...fieldStyle, gridColumn: full ? '1 / -1' : 'auto' }}>
      <span style={labelStyle}>
        {label}{required && <span style={{color:'#b8392b', marginLeft:4}}>*</span>}
      </span>
      {children}
      {hint && <span style={hintStyle}>{hint}</span>}
    </div>
  );
}

function Input({ value, onChange, ...rest }) {
  return (
    <input
      style={inputStyle}
      value={value || ''}
      onChange={e => onChange(e.target.value)}
      onFocus={e => e.target.style.borderColor = 'var(--liquorice)'}
      onBlur={e => e.target.style.borderColor = 'var(--line)'}
      {...rest}
    />
  );
}

function TextArea({ value, onChange, rows = 3, ...rest }) {
  return (
    <textarea
      style={{ ...inputStyle, resize:'vertical', minHeight: rows * 22, lineHeight:1.45, fontFamily:'inherit' }}
      value={value || ''}
      rows={rows}
      onChange={e => onChange(e.target.value)}
      onFocus={e => e.target.style.borderColor = 'var(--liquorice)'}
      onBlur={e => e.target.style.borderColor = 'var(--line)'}
      {...rest}
    />
  );
}

function Select({ value, onChange, options }) {
  return (
    <select style={inputStyle} value={value} onChange={e => onChange(e.target.value)}>
      {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
}
