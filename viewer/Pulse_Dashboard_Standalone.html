<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pulse — FOS Social Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   FOS SOCIAL DASHBOARD — DESIGN SYSTEM
   Editorial proprietary feel: Liquorice + Sunshine + Cream
   ============================================================ */

:root {
  /* Palette — Editorial (default) */
  --liquorice: #1F1A15;
  --liquorice-2: #15110d;
  --sunshine: #FFE019;
  --cream: #F5F1E8;
  --cream-2: #ECE6D6;
  --paper: #FAF7EF;
  --blossom: #F2A6A8;
  --flame: #DE6B38;
  --orange: #FF9947;
  --pear: #8FC766;
  --sky: #5CB5F2;
  --lilac: #A896F2;

  /* Semantic */
  --bg: var(--cream);
  --bg-soft: var(--cream-2);
  --surface: var(--paper);
  --ink: var(--liquorice);
  --ink-2: #443c33;
  --ink-3: #857d70;
  --line: rgba(31, 26, 21, 0.10);
  --line-2: rgba(31, 26, 21, 0.18);
  --accent: var(--flame);
  --accent-ink: var(--paper);
  --positive: #2f7a3f;
  --warning: var(--orange);
  --danger: #b8392b;

  /* Type */
  --serif: 'Newsreader', 'Source Serif 4', 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;

  /* Spacing scale */
  --pad-xs: 8px;
  --pad-sm: 12px;
  --pad-md: 16px;
  --pad-lg: 24px;
  --pad-xl: 32px;

  /* Radius */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;

  /* Shadows */
  --sh-1: 0 1px 0 rgba(36,28,23,0.06), 0 1px 2px rgba(36,28,23,0.04);
  --sh-2: 0 4px 20px -8px rgba(36,28,23,0.18);

  /* Density */
  --row-h: 44px;
  --card-pad: 22px;
}

[data-density="compact"] {
  --pad-md: 12px;
  --pad-lg: 18px;
  --pad-xl: 24px;
  --row-h: 36px;
  --card-pad: 16px;
}

[data-density="spacious"] {
  --pad-md: 20px;
  --pad-lg: 32px;
  --pad-xl: 44px;
  --row-h: 52px;
  --card-pad: 28px;
}

/* DARK */
[data-theme="dark"] {
  --bg: #18130f;
  --bg-soft: #201914;
  --surface: #2a221c;
  --ink: #f7eecf;
  --ink-2: #cbbfa5;
  --ink-3: #8a7e6a;
  --line: rgba(247, 238, 207, 0.10);
  --line-2: rgba(247, 238, 207, 0.18);
}

/* PALETTE: Sky */
[data-palette="sky"] {
  --accent: var(--sky);
  --accent-ink: #082c46;
}
/* PALETTE: Sunshine */
[data-palette="sunshine"] {
  --accent: var(--sunshine);
  --accent-ink: var(--liquorice);
}
/* PALETTE: Flame */
[data-palette="flame"] {
  --accent: var(--flame);
  --accent-ink: #fff7ee;
}
/* PALETTE: Pear */
[data-palette="pear"] {
  --accent: var(--pear);
  --accent-ink: #1d3a10;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

a { color: inherit; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: var(--liquorice);
  color: var(--cream);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sb-brand {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 8px 22px;
  border-bottom: 1px solid rgba(252,247,219,0.12);
  margin-bottom: 18px;
}
.sb-brand .mark {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--cream); color: var(--liquorice);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 22px; font-weight: 300; line-height: 1;
  flex-shrink: 0; align-self: center;
}
.sb-brand .name {
  font-family: var(--serif); font-size: 22px; line-height: 1;
  font-weight: 300; letter-spacing: -0.01em;
}
.sb-brand .name em { font-style: italic; color: var(--cream); }

.sb-section {
  text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.12em;
  color: rgba(252,247,219,0.4);
  padding: 14px 10px 6px;
  font-weight: 600;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: rgba(252,247,219,0.78);
  cursor: pointer; transition: all .15s;
  border: none; background: none;
  width: 100%; text-align: left;
  font-family: inherit;
}
.sb-item:hover { background: rgba(252,247,219,0.06); color: var(--cream); }
.sb-item.active {
  background: var(--cream); color: var(--liquorice);
  font-weight: 600;
}
.sb-item .ic { width: 16px; height: 16px; flex-shrink: 0; }
.sb-item .dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-left: auto;
}
.sb-foot {
  margin-top: auto;
  padding: 14px 10px;
  border-top: 1px solid rgba(252,247,219,0.12);
  display: flex; align-items: center; gap: 10px;
}
.sb-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blossom); color: var(--liquorice);
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
}
.sb-foot .who { font-size: 12px; line-height: 1.3; }
.sb-foot .who .nm { color: var(--cream); font-weight: 600; }
.sb-foot .who .em { color: rgba(252,247,219,0.5); }

/* MAIN */
.main {
  padding: 28px 36px 60px;
  min-width: 0;
}

/* HEADER */
.head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}
.head-title {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--ink);
}
.head-title em { font-style: italic; }
.head-sub { font-size: 13px; color: var(--ink-3); max-width: 520px; }
.head-sub strong { color: var(--ink); font-weight: 600; }
.head-actions { display: flex; gap: 10px; align-items: center; }

/* BUTTONS */
.btn {
  font-family: var(--sans);
  font-size: 13px; font-weight: 500;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: transparent; color: var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-pri {
  background: var(--liquorice); color: var(--cream);
  border-color: var(--liquorice);
}
.btn-pri:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-acc {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 600;
}
.btn-acc:hover { background: var(--ink); color: var(--accent); border-color: var(--ink); }
.btn-icon {
  width: 36px; height: 36px; padding: 0;
  display: grid; place-items: center;
  border-radius: 50%;
}

/* SEARCH */
.search {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  width: 240px;
  font-size: 13px;
}
.search input {
  border: none; outline: none; background: none;
  flex: 1; font: inherit; color: inherit;
}
.search input::placeholder { color: var(--ink-3); }

/* CARDS */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--card-pad);
  position: relative;
}
.card-h {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.card-title-serif {
  font-family: var(--serif); font-weight: 300;
  font-size: 22px; letter-spacing: -0.01em;
}
.card-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* SECTION */
.sec { margin-bottom: 28px; }
.sec-h {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px; gap: 16px;
}
.sec-title {
  font-family: var(--serif);
  font-size: 28px; line-height: 1;
  font-weight: 300; letter-spacing: -0.01em;
  color: var(--ink);
}
.sec-title em { font-style: italic; }
.sec-sub { font-size: 12px; color: var(--ink-3); }

/* PILLS */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.01em;
  border: 1px solid var(--line-2);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.pill-on { background: rgba(143,199,102,0.18); color: #1d4a14; border-color: rgba(143,199,102,0.4); }
.pill-on .dot { background: var(--positive); }
.pill-warn { background: rgba(255,153,71,0.18); color: #6b2f06; border-color: rgba(255,153,71,0.4); }
.pill-warn .dot { background: var(--warning); }
.pill-danger { background: rgba(184,57,43,0.12); color: var(--danger); border-color: rgba(184,57,43,0.3); }
.pill-danger .dot { background: var(--danger); }
.pill-ghost { background: transparent; color: var(--ink-2); }
.pill-ink { background: var(--liquorice); color: var(--cream); border-color: var(--liquorice); }
.pill-acc { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

[data-theme="dark"] .pill-on { background: rgba(143,199,102,0.18); color: #b6e29a; }
[data-theme="dark"] .pill-warn { background: rgba(255,153,71,0.18); color: #f3b07a; }
[data-theme="dark"] .pill-danger { background: rgba(242,166,168,0.18); color: #f2a6a8; }

/* KPI */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 28px;
}
.kpi {
  background: var(--surface);
  padding: 18px 20px 16px;
}
.kpi-lbl {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 10px;
}
.kpi-val {
  font-family: var(--serif);
  font-size: 36px; line-height: 1;
  font-weight: 300; letter-spacing: -0.02em;
  color: var(--ink);
}
.kpi-val .unit { font-size: 18px; color: var(--ink-3); margin-left: 2px; }
.kpi-foot {
  margin-top: 8px;
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ink-3);
}
.kpi-delta { font-weight: 600; }
.kpi-delta.up { color: var(--positive); }
.kpi-delta.dn { color: var(--danger); }

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-12 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-21 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }

/* CAMPAIGN CARD (big, on overview) */
.cmp-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all .18s;
  display: flex; flex-direction: column;
  min-height: 280px;
}
.cmp-card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.cmp-card.ft-1 { background: var(--orange); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-2 { background: var(--blossom); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-3 { background: var(--sky); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-4 { background: var(--pear); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-5 { background: var(--lilac); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-6 { background: var(--orange); color: var(--liquorice); border-color: transparent; }
.cmp-card.ft-ink { background: var(--liquorice); color: var(--cream); border-color: transparent; }

.cmp-card .partner-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.cmp-card .partner {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  opacity: 0.75;
}
.cmp-card .series {
  font-family: var(--serif); font-size: 32px;
  line-height: 1; font-weight: 300;
  letter-spacing: -0.015em;
  margin: 8px 0 16px;
}
.cmp-card .series em { font-style: italic; }
.cmp-pacing { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
.pace-row { display: flex; flex-direction: column; gap: 6px; }
.pace-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; font-weight: 500;
}
.pace-meta .pl { opacity: 0.7; }
.pace-meta .pv { font-weight: 600; }
.pace-bar {
  height: 4px; background: rgba(36,28,23,0.18);
  border-radius: 999px; overflow: hidden;
  position: relative;
}
.pace-bar > i {
  display: block; height: 100%;
  background: var(--liquorice);
  border-radius: 999px;
}
.pace-bar.on-light > i { background: var(--liquorice); }
.cmp-card .meta-foot {
  display: flex; justify-content: space-between;
  font-size: 11px; opacity: 0.7;
  padding-top: 14px; margin-top: 14px;
  border-top: 1px solid rgba(36,28,23,0.15);
}
.cmp-card .arrow {
  position: absolute; top: 22px; right: 22px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--liquorice); color: var(--cream);
  display: grid; place-items: center;
  transition: transform .18s;
}
.cmp-card.ft-ink .arrow { background: var(--cream); color: var(--liquorice); }
.cmp-card:hover .arrow { transform: translate(2px, -2px) rotate(-10deg); }

/* TOP POSTS */
.posts {
  display: flex; flex-direction: column;
}
.post {
  display: grid;
  grid-template-columns: 28px 1fr 100px 100px 100px 80px;
  align-items: center;
  gap: 16px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .12s;
}
.post:hover { background: var(--bg-soft); }
.post:last-child { border-bottom: none; }
.post .rank {
  font-family: var(--serif); font-size: 22px;
  font-weight: 400; color: var(--ink-3);
  font-style: italic;
}
.post-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.post-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-3); }
.post-quote {
  font-size: 14px; font-weight: 500; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.post-num { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.post-num .lbl { display: block; font-size: 10px; color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }

.post-plat {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg-soft); color: var(--ink);
  font-size: 11px; font-weight: 600;
  border: 1px solid var(--line);
}

/* CHARTS */
.chart-wrap {
  height: 220px;
  position: relative;
}
.chart-tall { height: 280px; }
.chart-short { height: 140px; }

/* CALLOUT */
.callout {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: var(--r-md);
  padding: 16px 18px;
}
.callout.pos { border-left-color: var(--positive); }
.callout.warn { border-left-color: var(--warning); }
.callout.neg { border-left-color: var(--danger); }
.callout.info { border-left-color: var(--sky); }
.callout-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
.callout-body { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

/* SOURCES */
.src-strip {
  display: flex; gap: 24px; flex-wrap: wrap;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 28px;
  font-size: 11px;
}
.src-strip .src-lbl {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3);
  align-self: center;
}
.src-item { display: flex; align-items: center; gap: 6px; }
.src-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--positive); }
.src-item .dot.stale { background: var(--warning); }
.src-item .nm { font-weight: 500; color: var(--ink); }
.src-item .dt { color: var(--ink-3); }

/* TABS / SEGMENTS */
.seg {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: none; background: none; color: var(--ink-3);
  font: inherit; font-size: 12px; font-weight: 500;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.seg button.active { background: var(--liquorice); color: var(--cream); }
.seg button:hover:not(.active) { color: var(--ink); }

/* TABLES */
.tbl {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.tbl td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.tbl tr:last-child td { border-bottom: none; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

/* CHANNEL TILE */
.chan {
  display: flex; flex-direction: column; gap: 8px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.chan-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chan-name {
  font-family: var(--serif); font-size: 22px;
  font-weight: 300; line-height: 1; letter-spacing: -0.01em;
}
.chan-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 8px; }
.chan-stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chan-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 500; }

/* FORMAT BARS */
.fbar { display: flex; flex-direction: column; gap: 12px; }
.fbar-row {
  display: grid; grid-template-columns: 110px 1fr 90px;
  align-items: center; gap: 12px;
}
.fbar-name { font-size: 13px; font-weight: 500; }
.fbar-track { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; position: relative; }
.fbar-fill { height: 100%; border-radius: 999px; }
.fbar-num { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* HERO POST CARD */
.hero-post {
  background: var(--liquorice);
  color: var(--cream);
  border-radius: var(--r-lg);
  padding: 28px;
  display: flex; flex-direction: column; gap: 16px;
  position: relative; overflow: hidden;
}
.hero-post::after {
  content: '';
  position: absolute; right: -40px; top: -40px;
  width: 200px; height: 200px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.1;
}
.hero-post .badge {
  display: inline-flex; align-self: flex-start;
  gap: 6px; align-items: center;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// ============================================================

function MultiLineChart({ data, series, height = 220 }) {
  const W = 760, H = height, P = { t: 18, r: 18, b: 28, l: 36 };
  const xs = data.map((_, i) => i);
  const allVals = data.flatMap(d => series.map(s => d[s.key]));
  const yMax = Math.max(...allVals) * 1.12;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, data.length - 1);
  const y = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);

  const yTicks = 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {/* gridlines */}
      {[...Array(yTicks + 1)].map((_, i) => {
        const v = (yMax / yTicks) * i;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W - P.r} y1={yy} y2={yy} stroke="currentColor" strokeOpacity="0.08"/>
            <text x={P.l - 8} y={yy + 3} fontSize="9" textAnchor="end" fill="currentColor" opacity="0.5">{fmt.num(v)}</text>
          </g>
        );
      })}
      {/* x labels */}
      {data.map((d, i) => (
        <text key={i} x={x(i)} y={H - 8} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.6">{d.m}</text>
      ))}
      {/* lines */}
      {series.map(s => {
        const pts = data.map((d, i) => `${x(i)},${y(d[s.key])}`).join(' ');
        return (
          <g key={s.key}>
            <polyline points={pts} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            {data.map((d, i) => (
              <circle key={i} cx={x(i)} cy={y(d[s.key])} r="3" fill={s.color}/>
            ))}
          </g>
        );
      })}
    </svg>
  );
}

// ============================================================
// SVG DONUT
// ============================================================
function Donut({ data, size = 180, thickness = 28, centerLabel, centerValue }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <g transform={`translate(${size/2},${size/2}) rotate(-90)`}>
        {data.map((d, i) => {
          const len = (d.value / total) * C;
          const dasharray = `${len} ${C - len}`;
          const dashoffset = -acc;
          acc += len;
          return (
            <circle key={i} r={r} fill="none" stroke={d.color}
              strokeWidth={thickness} strokeDasharray={dasharray} strokeDashoffset={dashoffset}/>
          );
        })}
      </g>
      <text x={size/2} y={size/2 - 4} textAnchor="middle"
        fontFamily="var(--serif)" fontSize="32" fill="currentColor">{centerValue}</text>
      <text x={size/2} y={size/2 + 16} textAnchor="middle"
        fontSize="10" fill="currentColor" opacity="0.6"
        style={{textTransform:'uppercase', letterSpacing:'0.1em', fontWeight:600}}>{centerLabel}</text>
    </svg>
  );
}

// ============================================================
// SVG BAR CHART
// ============================================================
function BarChart({ data, height = 220, valKey = 'value' }) {
  const W = 600, H = height, P = { t: 16, r: 16, b: 36, l: 16 };
  const max = Math.max(...data.map(d => d[valKey])) * 1.1;
  const bw = (W - P.l - P.r) / data.length - 8;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {data.map((d, i) => {
        const x = P.l + i * ((W - P.l - P.r) / data.length) + 4;
        const h = (d[valKey] / max) * (H - P.t - P.b);
        const y = H - P.b - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={bw} height={h} rx="6" fill={d.color || 'var(--ink)'} opacity={d.dim ? 0.3 : 1}/>
            <text x={x + bw/2} y={H - 18} fontSize="11" textAnchor="middle" fill="currentColor" opacity="0.7">{d.label}</text>
            <text x={x + bw/2} y={H - 6} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.5">{d.sub || ''}</text>
            <text x={x + bw/2} y={y - 6} fontSize="11" textAnchor="middle" fill="currentColor" fontWeight="600">{fmt.num(d[valKey])}</text>
          </g>
        );
      })}
    </svg>
  );
}

<script type="text/babel">
/* global React, CAMPAIGNS, TOP_POSTS, CHANNELS, FORMATS, fmt,

const { useState: useStateC } = React;

function CampaignPage({ campaignId, onBack }) {
  const c = CAMPAIGNS.find(x => x.id === campaignId) || CAMPAIGNS[0];
  const impPct = (c.impressions.delivered / c.impressions.goal) * 100;
  const budPct = (c.budget.delivered / c.budget.goal) * 100;
  const elapsedPct = c.elapsedPct;

  // Pacing health: are delivery + budget tracking with time elapsed?
  const impVsTime = impPct - elapsedPct;
  const budVsTime = budPct - elapsedPct;
  const paceHealth = (label, diff) => {
    if (diff > 5) return { label, status: 'ahead', text: `+${diff.toFixed(0)}% vs time` };
    if (diff < -5) return { label, status: 'behind', text: `${diff.toFixed(0)}% vs time` };
    return { label, status: 'on', text: 'in sync' };

              </div>
            );

// Tiny custom curve chart with goal line
function DeliveryCurve({ campaign }) {
  const W = 600, H = 240, P = { t: 16, r: 16, b: 30, l: 32 };
  const weeks = 16;
  const goal = campaign.impressions.goal;
  const progress = campaign.impressions.delivered / goal;
  const elapsed = campaign.elapsedPct / 100;

  const ideal = Array.from({length: weeks + 1}, (_, i) => (i / weeks) * goal);
  const actual = Array.from({length: weeks + 1}, (_, i) => {
    if (i / weeks > elapsed + 0.05) return null;
    const t = i / weeks / Math.max(0.01, elapsed);
    const noise = Math.sin(i * 1.3) * 0.04;
    return Math.min(goal, t * progress * goal + noise * goal);
  });

  const yMax = goal * 1.05;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / weeks;
  const y = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%',display:'block'}}>
      {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
        const v = p * yMax;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="currentColor" strokeOpacity="0.08"/>
            <text x={P.l-6} y={yy+3} fontSize="9" textAnchor="end" fill="currentColor" opacity="0.5">{fmt.num(v)}</text>
          </g>
        );
      })}
      <line x1={P.l} x2={W-P.r} y1={y(goal)} y2={y(goal)} stroke="var(--ink)" strokeWidth="1" strokeDasharray="3 3" opacity="0.5"/>
      <text x={W-P.r} y={y(goal)-6} fontSize="10" textAnchor="end" fill="currentColor" fontWeight="600">Goal {fmt.num(goal)}</text>
      <polyline points={ideal.map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--ink-3)" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.6"/>
      <polyline points={actual.filter(v => v !== null).map((v,i) => `${x(i)},${y(v)}`).join(' ')}
        fill="none" stroke="var(--flame)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1={x(weeks * elapsed)} x2={x(weeks * elapsed)}
        y1={P.t} y2={H-P.b} stroke="var(--ink)" strokeWidth="1" opacity="0.4"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="5" fill="var(--flame)"/>
      <circle cx={x(weeks * elapsed)} cy={y(progress * goal)} r="9" fill="var(--flame)" opacity="0.2"/>
      {[0, 4, 8, 12, 16].map(w => (
        <text key={w} x={x(w)} y={H-12} fontSize="10" textAnchor="middle" fill="currentColor" opacity="0.6">W{w + 1}</text>
      ))}
      <text x={x(weeks * elapsed)} y={P.t-2} fontSize="9" textAnchor="middle" fill="currentColor" fontWeight="600">Today</text>
    </svg>
  );
}

              {story.rows.map(r => (
                <tr key={r.plat} style={{borderTop:'1px solid var(--line)'}}>

}

// ── Callout block (Win / Watch / Opportunity) ──────────────
function Callout({ co }) {
  const tone = co.kind === 'pos' ? { bar: 'var(--pear)', tag: '#2f7a3f', bg:'rgba(143,199,102,0.12)' } :
    co.kind === 'warn' ? { bar: 'var(--orange)', tag: '#b8392b', bg:'rgba(255,153,71,0.14)' } :
    { bar: 'var(--sky)', tag: 'var(--ink)', bg:'rgba(80,135,230,0.08)' };
  return (
    <div style={{
      background:'var(--surface)', border:'1px solid var(--line)', borderRadius:'var(--r-lg)',
      padding: 22, position:'relative', overflow:'hidden',
      display:'flex', flexDirection:'column', gap:10
    }}>
      <div style={{position:'absolute', left:0, top:0, bottom:0, width:4, background: tone.bar}}/>
      <span style={{
        fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.14em',
        fontWeight:600, color: tone.tag, alignSelf:'flex-start',
        padding:'3px 8px', background: tone.bg, borderRadius: 4
      }}>{co.tag}</span>
      <div style={{fontFamily:'var(--serif)', fontSize:20, fontWeight:300, lineHeight:1.25, letterSpacing:'-0.01em', color:'var(--ink)'}}>{co.headline}</div>
      <div style={{fontSize:13, lineHeight:1.55, color:'var(--ink-2)'}}>{co.body}</div>
    </div>
  );
}

// ── Component section (full detail per component) ─────────
function ComponentSection({ comp }) {
  const impPct = (comp.impressions.delivered / comp.impressions.goal) * 100;

  return (
    <div id={`comp-${comp.id}`} className="sec" style={{scrollMarginTop:24}}>

          <div className="sec-title">{comp.title.replace(comp.italic, '').trim()} <em>{comp.italic}</em></div>
          <div className="sec-sub" style={{marginTop:6}}>{comp.sub} · Goal: {fmt.num(comp.impressions.goal)} impr · Budget: {fmt.money(comp.budget.goal)}</div>

          background: comp.statusKind === 'on' ? 'rgba(143,199,102,0.18)' : 'rgba(255,153,71,0.18)',

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24}}>
          <div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
              <span style={{fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-3)'}}>Impressions</span>
              <span style={{fontSize:12, color:'var(--ink-2)'}}>
                <strong style={{color:'var(--ink)'}}>{fmt.num(comp.impressions.delivered)}</strong> of {fmt.num(comp.impressions.goal)}
                <span style={{marginLeft:8, color: impPct >= 100 ? '#2f7a3f' : '#a06b14', fontWeight:600}}>{impPct.toFixed(1)}%</span>
              </span>
            </div>
            <PaceBarUB pct={impPct} color={accentColor}/>
          </div>
          <div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
              <span style={{fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-3)'}}>Spend</span>
              <span style={{fontSize:12, color:'var(--ink-2)'}}>
                <strong style={{color:'var(--ink)'}}>{fmt.money(comp.budget.delivered)}</strong> of {fmt.money(comp.budget.goal)}
                <span style={{marginLeft:8, color: budPct > 110 ? '#b8392b' : budPct < 50 ? '#a06b14' : 'var(--ink-2)', fontWeight:600}}>{budPct.toFixed(1)}%</span>
              </span>
            </div>
            <PaceBarUB pct={budPct} color={budPct > 110 ? 'var(--flame)' : 'var(--liquorice)'}/>

        </div>
        {comp.budgetNote && (
          <div style={{
            marginTop:14, padding:'10px 14px',
            background:'rgba(255,206,0,0.14)', border:'1px solid rgba(255,206,0,0.3)',
            borderRadius:8, fontSize:12, color:'var(--ink-2)', lineHeight:1.5
          }}>
            <strong style={{color:'var(--ink)'}}>Budget note: </strong>{comp.budgetNote}
          </div>
        )}
      </div>

      {/* KPIs */}
      <div className="kpi-row" style={{gridTemplateColumns:'repeat(5, 1fr)'}}>
        <div className="kpi"><div className="kpi-lbl">Posts Live</div><div className="kpi-val">{comp.posts}</div><div className="kpi-foot"><span className="muted">{comp.sub.split('·')[0].trim().toLowerCase()}</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Impressions</div><div className="kpi-val">{fmt.num(comp.impressions.delivered)}</div><div className="kpi-foot"><span className="muted">{impPct.toFixed(1)}% of goal</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Engagements</div><div className="kpi-val">{fmt.num(comp.engagements)}</div><div className="kpi-foot"><span className="muted">cross-platform</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Eng. Rate</div><div className="kpi-val">{comp.er}<span className="unit">%</span></div><div className="kpi-foot"><span className="muted">blended</span></div></div>
        <div className="kpi"><div className="kpi-lbl">Spend</div><div className="kpi-val">{fmt.money(comp.budget.delivered)}</div><div className="kpi-foot"><span className="muted">of {fmt.money(comp.budget.goal)} ({budPct.toFixed(0)}%)</span></div></div>
      </div>

      {/* Platform performance table */}
      {comp.platforms && (
        <div style={{marginTop:24, marginBottom:18}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Platform <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>
            Engagements = MS social engagements + Google Ads YT Shorts engagements combined. Paid impressions sourced from Meta Ads Manager (IG/FB), X Ads Manager, and Google Ads (YT Shorts). Organic from Measure Studio.
          </div>
          <PlatformTable comp={comp}/>
        </div>
      )}

      {/* Stories (Come Up) or Videos (Red Carpet) */}
      {comp.stories && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Story <em>performance</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14}}>4 stories × 5 platforms = 20 posts. Click any row to see the platform breakdown.</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {comp.stories.map(s => <StoryCard key={s.name} story={s} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {comp.videos && (
        <div style={{marginTop:24}}>
          <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:6}}>Per-video <em>detail</em></div>
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:14, maxWidth:720, lineHeight:1.5}}>2 videos across 5 platforms. Video 1 is organic boosted with paid amplification. Video 2 is paid-only (dark) — no organic delivery anywhere.</div>
          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            {comp.videos.map(v => <VideoCard key={v.name} video={v} accentColor={accentColor}/>)}
          </div>
        </div>
      )}

      {/* Callouts */}
      <div style={{marginTop:24}}>
        <div style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, marginBottom:14}}>What we're <em>seeing</em></div>
        <div style={{display:'grid', gridTemplateColumns: comp.callouts.length === 1 ? '1fr' : `repeat(${comp.callouts.length}, 1fr)`, gap:14}}>
          {comp.callouts.map((co, i) => <Callout key={i} co={co}/>)}
        </div>
      </div>
    </div>
  );
}

<script type="text/babel">
/* global React, BENCHMARKS_DATA, PageHead */
const { useState: useStateB } = React;

// ============================================================
// BENCHMARKS PAGE
// FOS social ER benchmarks across content categories.
// Source: config/social_benchmarks.csv
// ============================================================

function BenchmarksPage() {
  const data = window.BENCHMARKS_DATA || {};
  const categories = data.categories || [];
  const platformSummary = data.platformSummary || data.platform_summary || [];
  const lastUpdated = data.lastUpdated || data.last_updated || '—';
  const [openIdx, setOpenIdx] = useStateB(0);

  return (
    <>
      <PageHead
        overline={`FOS Internal · Last updated ${lastUpdated}`}
        title="Benchmarks"
        italic="by category."
        sub={<>Engagement rate benchmarks across content types, drawn from completed FOS campaigns. <strong>Sponsored-only</strong> is the true benchmark for current work; <strong>all-content</strong> shown as a broader reference.</>}
      />

      {/* PLATFORM SUMMARY */}
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">Platform <em>benchmarks (2025)</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Aggregate ER% across all FOS social activity.</div>
          </div>
        </div>
        <PlatformSummaryTable rows={platformSummary}/>
      </div>

      {/* CATEGORY NAV CHIPS */}
      <div className="sec">
        <div className="sec-h">
          <div>
            <div className="sec-title">By <em>category</em></div>
            <div className="sec-sub" style={{marginTop:6}}>Click a category to jump to its detail.</div>
          </div>
        </div>
        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:24}}>
          {categories.map((cat, i) => (
            <button
              key={i}
              onClick={() => { setOpenIdx(i); document.getElementById(`cat-${i}`)?.scrollIntoView({behavior:'smooth', block:'start'}); }}
              style={{
                fontFamily:'inherit', fontSize:12, fontWeight:500,
                padding:'7px 14px', borderRadius:999,
                background: i === openIdx ? 'var(--liquorice)' : 'var(--surface)',
                color: i === openIdx ? 'var(--cream)' : 'var(--ink)',
                border:`1px solid ${i === openIdx ? 'var(--liquorice)' : 'var(--line)'}`,
                cursor:'pointer'
              }}
            >
              {shortCategoryName(cat.name)}
            </button>
          ))}
        </div>
      </div>

      {/* CATEGORY SECTIONS */}
      {categories.map((cat, i) => (
        <CategorySection key={i} cat={cat} idx={i}/>
      ))}
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Platform summary — top 3-row table
// ──────────────────────────────────────────────────────────
function PlatformSummaryTable({ rows }) {
  if (!rows.length) return null;
  // Get unique platforms across all rows, preserving canonical order
  const order = ['Instagram', 'Facebook', 'X', 'TikTok', 'LinkedIn', 'YouTube'];
  const platforms = order.filter(p => rows.some(r => r.platforms && r.platforms[p] !== undefined));

  return (
    <div className="card" style={{padding:0, overflow:'hidden'}}>
      <table className="tbl" style={{width:'100%', fontSize:13}}>
        <thead>
          <tr>
            <th style={{textAlign:'left'}}>Row</th>
            {platforms.map(p => <th key={p} className="num" style={{textAlign:'right'}}>{p}</th>)}
            <th className="num" style={{textAlign:'right', borderLeft:'1px solid var(--line)'}}>All (AVG)</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => {
            const isPrimary = row.row.toLowerCase().includes('all content in this doc') || row.row.toLowerCase().includes('all content');
            return (
              <tr key={i} style={{background: i === rows.length - 1 ? 'rgba(222,107,56,0.06)' : undefined}}>
                <td style={{fontWeight: i === rows.length - 1 ? 600 : 500, fontSize: 13}}>
                  {row.row}
                  {i === rows.length - 1 && <span style={{marginLeft:8, fontSize:9, fontFamily:'var(--mono)', letterSpacing:'0.1em', color:'var(--flame)', fontWeight:700}}>FOS</span>}
                </td>
                {platforms.map(p => (
                  <td key={p} className="num">
                    {row.platforms && row.platforms[p] !== undefined ? `${row.platforms[p].toFixed(2)}%` : '—'}
                  </td>
                ))}
                <td className="num" style={{fontWeight:600, borderLeft:'1px solid var(--line)'}}>
                  {(() => {
                    const v = row.allAvg !== undefined ? row.allAvg : row.all_avg;
                    return v !== null && v !== undefined ? `${v.toFixed(2)}%` : '—';
                  })()}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Category section — overall ER + per-campaign table
// ──────────────────────────────────────────────────────────
function CategorySection({ cat, idx }) {
  const overall = cat.overall || {};
  // Get the platform columns that appear in the campaigns / overall
  const PLATFORM_ORDER = ['YouTube', 'Instagram', 'Facebook', 'X', 'TikTok', 'LinkedIn', 'Shorts'];
  const platforms = PLATFORM_ORDER.filter(p =>
    overall[p] !== undefined || (cat.campaigns || []).some(c => c.platforms && c.platforms[p] !== undefined)
  );

  return (
    <div id={`cat-${idx}`} className="sec" style={{marginBottom:36, scrollMarginTop:24}}>
      <div className="sec-h" style={{borderBottom:'1px solid var(--line)', paddingBottom:14}}>
        <div>
          <div style={{fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.16em', fontWeight:600, color:'var(--ink-3)', marginBottom:6, textTransform:'uppercase'}}>
            Category {String(idx + 1).padStart(2, '0')}
          </div>
          <div className="sec-title">{cat.name}</div>
        </div>
        {overall.All !== null && overall.All !== undefined && (
          <span style={{
            display:'inline-flex', alignItems:'center', gap:6,
            padding:'5px 12px', borderRadius:999,
            background:'var(--bg-soft)', border:'1px solid var(--line)',
            fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.06em', fontWeight:600, color:'var(--ink-2)'
          }}>
            CATEGORY AVG <strong style={{color:'var(--ink)', marginLeft:4}}>{overall.All.toFixed(2)}%</strong>
          </span>
        )}
      </div>

      {/* Overall ER per platform — category benchmark row */}
      <div style={{marginTop:18, marginBottom:18}}>
        <div style={{fontSize:10, fontFamily:'var(--mono)', letterSpacing:'0.12em', fontWeight:600, color:'var(--ink-3)', marginBottom:10, textTransform:'uppercase'}}>
          Category benchmark · ER by platform
        </div>
        <div className="card" style={{padding:0, overflow:'hidden'}}>
          <div style={{display:'grid', gridTemplateColumns:`repeat(${platforms.length}, minmax(0, 1fr))`, borderTop:'none'}}>
            {platforms.map((p, i) => (
              <div key={p} style={{
                padding:'14px 12px',
                borderRight: i < platforms.length - 1 ? '1px solid var(--line)' : 'none',
                display:'flex', flexDirection:'column', gap:4
              }}>
                <span style={{fontSize:10, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.1em', fontWeight:600}}>{p}</span>
                <span style={{fontFamily:'var(--serif)', fontSize:22, fontWeight:300, color:'var(--ink)', letterSpacing:'-0.02em'}}>
                  {overall[p] !== null && overall[p] !== undefined ? `${overall[p].toFixed(2)}%` : '—'}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Per-campaign breakdown */}
      {(cat.campaigns || []).length > 0 && (
        <div>
          <div style={{fontSize:10, fontFamily:'var(--mono)', letterSpacing:'0.12em', fontWeight:600, color:'var(--ink-3)', marginBottom:10, textTransform:'uppercase'}}>
            By campaign — green ▲ above category bench · red ▼ below
          </div>
          <div className="card" style={{padding:0, overflow:'auto'}}>
            <table className="tbl" style={{width:'100%', fontSize:13}}>
              <thead>
                <tr>
                  <th style={{textAlign:'left'}}>Campaign</th>
                  {platforms.map(p => <th key={p} className="num" style={{textAlign:'right'}}>{p}</th>)}
                  <th className="num" style={{textAlign:'right', borderLeft:'1px solid var(--line)'}}>All</th>
                  <th className="num" style={{textAlign:'right'}}>Spend</th>
                </tr>
              </thead>
              <tbody>
                {cat.campaigns.map((camp, i) => (
                  <tr key={i}>
                    <td style={{fontWeight:500, maxWidth:280, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{camp.name}</td>
                    {platforms.map(p => {
                      const v = camp.platforms && camp.platforms[p];
                      const bench = overall[p];
                      const color = (v != null && bench != null)
                        ? (v > bench ? 'var(--positive)' : v < bench ? 'var(--danger)' : 'var(--ink-2)')
                        : 'var(--ink-3)';
                      const weight = (v != null && bench != null && (v > bench || v < bench)) ? 600 : 400;
                      return (
                        <td key={p} className="num" style={{color, fontWeight:weight}}>
                          {v != null ? `${v.toFixed(2)}%` : '—'}
                        </td>
                      );
                    })}
                    <td className="num" style={{fontWeight:600, borderLeft:'1px solid var(--line)'}}>
                      {camp.all != null ? `${camp.all.toFixed(2)}%` : '—'}
                    </td>
                    <td className="num" style={{fontVariantNumeric:'tabular-nums', color:'var(--ink-3)'}}>
                      {camp.spend || '—'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function shortCategoryName(name) {
  if (!name) return '';
  // Strip trailing "(parenthetical detail)" for chips
  return name.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

window.BenchmarksPage = BenchmarksPage;

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "palette": "flame",
  "theme": "light",
  "density": "balanced",
  "serifHeadlines": true
};

function App() {
  const [view, setView] = React.useState({ view: 'overview', id: null });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  window.__activeCampaignId = view.id;

  React.useEffect(() => {
    const root = document.documentElement;
    root.setAttribute('data-theme', tweaks.theme);
    root.setAttribute('data-density', tweaks.density);
    const palMap = { flame: '', sky: 'sky', sunshine: 'sunshine', pear: 'pear' };
    if (palMap[tweaks.palette]) {
      root.setAttribute('data-palette', palMap[tweaks.palette]);
    } else {
      root.removeAttribute('data-palette');
    }
    if (!tweaks.serifHeadlines) {
      root.style.setProperty('--serif', "'Inter', sans-serif");
    } else {
      root.style.removeProperty('--serif');
    }
  }, [tweaks]);

  return (
    <div className="app">
      <Sidebar
        active={view.view}
        onNav={setView}
        campaigns={CAMPAIGNS}
      />
      <main className="main" data-screen-label={view.view === 'overview' ? '01 Overview' : view.view === 'benchmarks' ? '02 Benchmarks' : `03 Campaign — ${view.id}`}>
        {view.view === 'overview' ? (
          <OverviewPage onOpenCampaign={(id) => setView({ view: 'campaign', id })}/>
        ) : view.view === 'benchmarks' ? (
          <BenchmarksPage/>
        ) : view.id === 'usbank' ? (
          <UsBankPage campaignId={view.id} onBack={() => setView({ view: 'overview' })}/>
        ) : (
          <CampaignPage campaignId={view.id} onBack={() => setView({ view: 'overview' })}/>
        )}
      </main>

      <TweaksPanel>
        <TweakSection label="Look"/>
        <TweakRadio label="Theme" value={tweaks.theme}
          options={['light','dark']}
          onChange={v => setTweak('theme', v)}/>
        <TweakColor label="Accent" value={tweaks.palette}
          options={['#DE6B38','#5CB5F2','#8FC766','#A896F2']}
          onChange={v => {
            const map = {'#DE6B38':'flame','#5CB5F2':'sky','#8FC766':'pear','#A896F2':'lilac'};
            setTweak('palette', map[v] || 'flame');
          }}/>
        <TweakSection label="Layout"/>
        <TweakRadio label="Density" value={tweaks.density}
          options={['compact','balanced','spacious']}
          onChange={v => setTweak('density', v)}/>
        <TweakToggle label="Serif headlines" value={tweaks.serifHeadlines}
          onChange={v => setTweak('serifHeadlines', v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
